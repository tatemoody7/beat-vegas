# Pinning the actions to commit SHAs (see any workflow's `uses:`) removes the
# tag-move supply-chain risk but replaces it with a staleness one: a pinned SHA
# never picks up a security fix on its own. This is the other half of that
# trade. Dependabot rewrites the SHA and its `# v5` comment together, so the
# pins stay both exact and current.
#
# npm is here for the reason this file exists at all: the review found next
# 16.2.7 carrying a critical advisory that had been out for a while, with
# nothing in the repo watching for it.
version: 2
updates:
  - package-ecosystem: github-actions
    # `/` covers .github/workflows only; a composite action's own `uses:` pins
    # live in its directory and need naming here or they are never bumped.
    directories:
      - /
      - /.github/actions/cfbd-cache
      - /.github/actions/cfbd-cache-save
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # requirements/lock.txt (hash-pinned, resolved for the 3.11 runner). Dependabot
  # rewrites the pins and their hashes together. Its Python fetcher only sees
  # files ending in .txt or .in, so the lock lives in its own directory under a
  # .txt name and this entry points THERE -- not at `/`, where Dependabot found
  # requirements.txt and raised every human-readable range to the latest
  # release instead (PR #171, closed). requirements.txt stays the local-dev
  # range file and is not what the runners install from.
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: "web"
    # One PR for the routine bumps; anything with an advisory still comes
    # through on its own so it is not buried in a group.
    groups:
      dev-tooling:
        dependency-type: development
        patterns: ["*"]
