# Pinning the actions to commit SHAs (see any workflow's `uses:`) removes the
# tag-move supply-chain risk but replaces it with a staleness one: a pinned SHA
# never picks up a security fix on its own. This is the other half of that
# trade. Dependabot rewrites the SHA and its `# v5` comment together, so the
# pins stay both exact and current.
#
# npm is here for the reason this file exists at all: the review found next
# 16.2.7 carrying a critical advisory that had been out for a while, with
# nothing in the repo watching for it.
version: 2
updates:
  - package-ecosystem: github-actions
    # `/` covers .github/workflows only; a composite action's own `uses:` pins
    # live in its directory and need naming here or they are never bumped.
    directories:
      - /
      - /.github/actions/cfbd-cache
      - /.github/actions/cfbd-cache-save
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # requirements/lock.txt (hash-pinned, resolved for the 3.11 runner). Dependabot
  # rewrites the pins and their hashes together. Its Python fetcher only sees
  # files ending in .txt or .in, so the lock lives in its own directory under a
  # .txt name and this entry points THERE -- not at `/`, where Dependabot found
  # requirements.txt and raised every human-readable range to the latest
  # release instead (PR #171, closed). requirements.txt stays the local-dev
  # range file and is not what the runners install from.
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    groups:
      python:
        patterns: ["*"]
    # Dependabot sees only the lock, not requirements.txt's deliberate
    # next-major caps, so left alone it proposes pandas 3 / pytest 9 against
    # ranges that forbid them (PR #173). Majors are a human decision here; a
    # regenerated lock (the header recipe) takes every minor/patch within the
    # caps, and uv honours python_requires markers that Dependabot ignored
    # (contourpy 1.4.0 needs 3.12; the runner is 3.11).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # ...and requirements/.python-version tells Dependabot which interpreter to
    # resolve for. Without it, its resolver ignores Requires-Python markers and
    # proposes wheels the runner cannot install: contourpy 1.4.0 (PR #173) and
    # numpy 2.5.3 / scipy 1.18.1 (PR #184) all need 3.12 while the runner and the
    # lock are 3.11, and both are MINOR bumps, so the major-version ignore above
    # never sees them. The file sits beside the manifest rather than at the repo
    # root so a root-level pyenv shim cannot start switching this Mac's
    # interpreter (local dev is 3.9).

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: "web"
    # One PR for the routine bumps; anything with an advisory still comes
    # through on its own so it is not buried in a group.
    groups:
      dev-tooling:
        dependency-type: development
        patterns: ["*"]
    # Three majors are deliberate human decisions, not routine bumps, and each
    # one buried in an 11-package group is how a green CI hides a real break:
    #   eslint 10   -- eslint-config-next's eslint-plugin-react throws inside
    #                  usedPropTypes and `eslint .` exits 2 (measured 2026-09-20).
    #   typescript 7 -- the Go compiler rewrite; typescript-eslint and
    #                  eslint-config-next compatibility is unproven here.
    #   vitest 5    -- 450 tests and a config this repo's parity guards read.
    # Take each on its own when there is time to watch it.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
