name: Backfill real 1H lines (Odds API historical)

# Manual only. Pulls the TRUE near-kickoff 1H closing line per game from The Odds
# API HISTORICAL endpoint into Neon, replacing the 0.52x proxy in the backtest.
#
# EXPENSIVE: the historical per-event totals_h1 market costs (markets x regions)
# credits PER GAME at a higher historical multiplier — so this is gated by
# season/week/limit and `dry_run` DEFAULTS TO TRUE. Always dry-run first, then run
# a small `limit` and read the credit log before scaling.
#
# Prereq: the season's GAMES must already be in Neon (this only adds 1H_total
# snapshots and matches them to existing Game rows). Idempotent — games that
# already have a 1H_total snapshot are skipped.

# Least privilege: these jobs read the repo and write to Neon via
# secrets; none of them pushes to git. Without this block the job
# inherits whatever the repository default happens to be, and that
# default is a setting someone can change later without touching
# any workflow.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'season (e.g. 2024)'
        required: true
      week:
        description: 'week (blank = whole season — watch credits!)'
        default: ''
      limit:
        description: 'max games this run (credit cap; 0 = all)'
        default: '10'
      lead_min:
        description: 'minutes before kickoff to snapshot as the 1H close'
        default: '30'
      dry_run:
        description: 'true = list only, spend ZERO credits'
        default: 'true'

concurrency:
  group: neon-writers
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install
        # Hash-pinned: requirements/lock.txt names the exact release AND sha256 of
        # every package (see its header), so a compromised upload of any of them
        # cannot reach a runner that holds DATABASE_URL and the API keys. The
        # editable install of this repo then runs without build isolation, so
        # the build backend (setuptools, also in the lock) is never fetched
        # unhashed. Local dev keeps plain `pip install -e .`.
        run: |
          pip install --require-hashes -r requirements/lock.txt
          pip install --no-deps --no-build-isolation -e .
      - name: Backfill 1H history
        # Inputs go through env, never inlined into bash (script-injection hygiene).
        env:
          IN_SEASON: ${{ inputs.season }}
          IN_WEEK: ${{ inputs.week }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_LEAD_MIN: ${{ inputs.lead_min }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS="--season $IN_SEASON --limit $IN_LIMIT --lead-min $IN_LEAD_MIN"
          if [ -n "$IN_WEEK" ]; then ARGS="$ARGS --week $IN_WEEK"; fi
          if [ "$IN_DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "running: backfill_1h_history.py $ARGS"
          python scripts/backfill_1h_history.py $ARGS
