name: Bet card (cloud)

# Builds the week's first-half-under bet card and publishes it to the Board
# (`cards` table, read by the site), logging EVERY qualifying game (Hard Rock's
# 1H line >= 1.75 above ours) as a paper pick tagged with the gate that blocked a
# real bet. No text from here: the Saturday-morning routine `cfb-saturday-card`
# (Mac, 8:50am ET) reads the newest card and texts the BET list; a red run is
# reported by GitHub's failed-workflow email and that routine re-dispatches
# the final when GitHub cron dropped it.
#
# SLOTS — one source of truth: beatvegas/ci.py::resolve_slot (tests/test_ci_slots.py
# + tests/test_workflows.py keep this schedule and that table in lock-step):
#   weeknight  Tue/Wed/Thu 20:05Z (~4:05pm ET; retry 20:50Z) — sweep tonight's
#              games, build, paper-log games kicking off within 10 h.
#   friday     22:05Z (~6:05pm ET; retry 23:00Z) — PREVIEW: full sweep of the
#              weekend slate, build, paper-log Friday-night games only (6 h).
#   saturday   12:05Z / 12:35Z / 13:05Z / 13:35Z — FINAL: gated on the Eastern
#              clock (runs only 7:45-9:15am ET, and only once per Saturday),
#              so it lands 8:05-8:45am ET in EDT and EST alike. Forced fresh
#              sweep + research preview, then build; paper-logs the Saturday
#              slate (20 h). Tate bets in one sitting off this card ~9am ET.
#   manual     workflow_dispatch (input `slot` may name one of the above).
# The preview and the final ALWAYS re-sweep (an evening close poll would
# otherwise satisfy "a 1H snapshot exists today" and the final would build on
# Friday's numbers); weeknight builds sweep only what is missing.
#
# CONCURRENCY: shared `neon-writers` group (see lines_watch.yml header).

on:
  schedule:
    - cron: '5 20 * * 2,3,4'   # weeknight
    - cron: '50 20 * * 2,3,4'  # weeknight retry
    - cron: '5 22 * * 5'       # friday preview
    - cron: '0 23 * * 5'       # friday retry
    - cron: '5 12 * * 6'       # saturday final (EDT primary)
    - cron: '35 12 * * 6'      # saturday final (EDT retry)
    - cron: '5 13 * * 6'       # saturday final (EST primary / EDT last retry)
    - cron: '35 13 * * 6'      # saturday final (EST retry)
  workflow_dispatch:
    inputs:
      slot:
        description: 'weeknight | friday | saturday | manual (default: manual full refresh)'
        required: false
        default: ''
      season:
        description: 'season (default: current)'
        required: false
        default: ''
      week:
        description: 'week (default: the active week)'
        required: false
        default: ''

concurrency:
  group: neon-writers
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve slot (beatvegas/ci.py; ET-gated Saturday final)
        id: slot
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_SLOT: ${{ inputs.slot }}
          GH_TOKEN: ${{ github.token }}
        # System python only (no pip yet): beatvegas.ci imports nothing else.
        run: |
          PYTHONPATH=. python3 -m beatvegas.ci
          slot=$(grep '^slot=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          retry_since=$(grep '^retry_since=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
          # A retry slot only runs when no SCHEDULED run of this workflow
          # succeeded since the primary slot's window opened.
          if [ -n "$retry_since" ] && [ "$slot" != "skip" ]; then
            done_already=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$GITHUB_WORKFLOW" \
              --event schedule --status success --json createdAt \
              --jq "[.[] | select(.createdAt >= \"$retry_since\")] | length" 2>/dev/null || echo 0)
            if [ "${done_already:-0}" -gt 0 ]; then
              echo "a scheduled run already succeeded since $retry_since; skipping"
              echo "slot=skip" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "resolved slot=$(grep '^slot=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2) (schedule='$SCHEDULE')"
      - uses: actions/setup-python@v6
        if: steps.slot.outputs.slot != 'skip'
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        if: steps.slot.outputs.slot != 'skip'
        run: pip install -e .
      - name: Resolve season / week
        id: active
        if: steps.slot.outputs.slot != 'skip'
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WEEK: ${{ inputs.week }}
        run: |
          read -r SEASON WEEK <<< "$(python -c 'from beatvegas.season import active; s, w = active(); print(s, w if w is not None else "")')"
          SEASON="${INPUT_SEASON:-$SEASON}"
          WEEK="${INPUT_WEEK:-$WEEK}"
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          echo "season=$SEASON week=${WEEK:-none}"
      - name: Check today's inputs (1H sweep + preview)
        id: inputs
        if: steps.slot.outputs.slot != 'skip' && steps.active.outputs.week != ''
        env:
          SEASON: ${{ steps.active.outputs.season }}
          WEEK: ${{ steps.active.outputs.week }}
          FORCE_SWEEP: ${{ steps.slot.outputs.force_sweep }}
          FORCE_PREVIEW: ${{ steps.slot.outputs.force_preview }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from beatvegas.db.models import Game, GamePreview, OddsSnapshot
          from beatvegas.db.store import init_db, session_scope
          init_db()
          season, week = int(os.environ["SEASON"]), int(os.environ["WEEK"])
          today = datetime.utcnow().replace(hour=0, minute=0, second=0, microsecond=0)
          with session_scope() as s:
              snaps = (
                  s.query(OddsSnapshot.id)
                  .join(Game, Game.id == OddsSnapshot.game_id)
                  .filter(Game.season == season, Game.week == week,
                          OddsSnapshot.market == "1H_total", OddsSnapshot.captured_at >= today)
                  .count()
              )
              previews = (
                  s.query(GamePreview.id)
                  .filter(GamePreview.season == season, GamePreview.week == week,
                          GamePreview.updated_at >= today)
                  .count()
              )
          force_sweep = os.environ.get("FORCE_SWEEP") == "true"
          force_preview = os.environ.get("FORCE_PREVIEW") == "true"
          print(f"need_sweep={'true' if (force_sweep or snaps == 0) else 'false'}")
          print(f"need_preview={'true' if (force_preview or previews == 0) else 'false'}")
          PY
          cat "$GITHUB_OUTPUT"
      - name: 1H sweep (forced for the preview / final; else only when today's is missing)
        if: steps.inputs.outputs.need_sweep == 'true'
        run: python scripts/poll_lines.py ${{ steps.slot.outputs.sweep_args }}
      - name: Research preview (forced on the final; else only when today's is missing)
        if: steps.inputs.outputs.need_preview == 'true'
        # Unofficial sources (ESPN / Rotowire) may be down; the card still builds
        # with the QB-out gate reading whatever preview is on file.
        continue-on-error: true
        run: python scripts/research_preview.py --season "${{ steps.active.outputs.season }}" --week "${{ steps.active.outputs.week }}"
      - name: Build + publish the card (+ paper-log qualifying games in the slot's window)
        if: steps.slot.outputs.slot != 'skip'
        env:
          PAPER_WINDOW: ${{ steps.slot.outputs.paper_window }}
        run: |
          if [ -z "${{ steps.active.outputs.week }}" ]; then
            echo "no active week — nothing to build"
            echo "No active week — no card built." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          extra=""
          if [ -n "$PAPER_WINDOW" ]; then extra="--paper-log-window-hours $PAPER_WINDOW"; fi
          python scripts/build_card.py --season "${{ steps.active.outputs.season }}" --week "${{ steps.active.outputs.week }}" $extra
