name: Bet card (cloud)

# Builds the week's first-half-under bet card and publishes it to the Board
# (`cards` table, read by the site), logging EVERY qualifying game (Hard Rock's
# 1H line >= 1.75 above ours) as a paper pick tagged with the gate that blocked a
# real bet. No text from here: the Saturday-morning routine `cfb-saturday-card`
# (Mac, 8:50am ET) reads the newest card and texts the BET list; a red run is
# reported by GitHub's failed-workflow email and that routine re-dispatches
# the final when GitHub cron dropped it.
#
# SLOTS — one source of truth: beatvegas/ci.py::resolve_slot (tests/test_ci_slots.py
# + tests/test_workflows.py keep this schedule and that table in lock-step).
# FOUR decision builds a week, every one a whole-week sweep and every one final:
#   tue_pm  Tue ~4:05pm ET   paper window 48 h (-> Thursday's build)
#   thu_pm  Thu ~4:05pm ET   paper window 24 h (-> Friday's build)
#   fri_pm  Fri ~4:05pm ET   paper window: the REST OF THE WEEK
#   sat_am  Sat ~8:05am ET   paper window: the rest of the week (mop-up)
#   manual  workflow_dispatch with no slot — status `preview`, never a final.
# The afternoon times track when Hard Rock actually posts first-half lines
# (23 of this week's games appeared Tuesday afternoon, the bulk of a Saturday
# slate on Friday afternoon) instead of sweeping every morning for numbers that
# have not moved. FRIDAY ANCHORS THE WEEKEND (2026-09-13): the midweek windows
# are still the gap to the next build, so they claim only the games kicking off
# before anyone looks again, but Friday takes the rest of the week and Saturday
# logs whatever newly qualifies. Every window used to be that gap, and on a
# Saturday sport that handed the whole slate to sat_am — all 25 of week 2's
# paper picks came from one build. beatvegas/ci.py::PAPER_WINDOW_HOURS.
# Each slot has four crons; the ET gate admits the two that land in the window
# in the current DST regime, so nothing needs editing twice a year.
#
# TRIGGERS: a Vercel cron dispatches the slot by name (independent of both this
# scheduler and Tate's Mac); these crons are the BACKUP. Inputs: `slot` names
# one of the four, `force` rebuilds one already built today, `max_credits` caps
# the sweep so a DEGRADED card can be rehearsed.
# ONCE PER DAY: the resolve step probes the `cards` table (beatvegas.ci
# slots_built_today) — a card row for today's ET date is a positive fact that
# the build happened, so later crons skip AND so does a second dispatch of the
# same slot (that is what stops Vercel and GitHub both building; `force=true`
# overrides). The old `gh run list --status success` check counted a gate-skip
# run as a success, which from November (EST) blocked the 13:05Z build behind
# the 12:35Z skip.
#
# DEGRADED INPUTS (PR-7): the sweep and the research preview each write a status
# file ($RUNNER_TEMP), and the build reads both. A sweep that stopped at the
# credit floor/cap, or an empty injury feed (which makes the QB-out gate pass
# every game), marks the games it touched paper only and the card "degraded" —
# visible on the board banner and as line 2 of the build summary.
# Every scheduled build ALWAYS re-sweeps (an evening close poll would otherwise
# satisfy "a 1H snapshot exists today" and the card would build on yesterday's
# numbers).
#
# CONCURRENCY: shared `neon-writers` group (see lines_watch.yml header).

# Least privilege: these jobs read the repo and write to Neon via
# secrets; none of them pushes to git. Without this block the job
# inherits whatever the repository default happens to be, and that
# default is a setting someone can change later without touching
# any workflow.
permissions:
  contents: read

on:
  schedule:
    # Four per slot; the ET gate in beatvegas/ci.py admits the two that land
    # inside the window in the current DST regime. :05/:35 rather than the top
    # of the hour, where GitHub's scheduler drops the most runs.
    - cron: '5 20 * * 2'      # tue_pm (EDT primary)
    - cron: '35 20 * * 2'     # tue_pm (EDT retry)
    - cron: '5 21 * * 2'      # tue_pm (EST primary / EDT last retry)
    - cron: '35 21 * * 2'     # tue_pm (EST retry)
    - cron: '5 20 * * 4'      # thu_pm (EDT primary)
    - cron: '35 20 * * 4'     # thu_pm (EDT retry)
    - cron: '5 21 * * 4'      # thu_pm (EST primary / EDT last retry)
    - cron: '35 21 * * 4'     # thu_pm (EST retry)
    - cron: '5 20 * * 5'      # fri_pm (EDT primary)
    - cron: '35 20 * * 5'     # fri_pm (EDT retry)
    - cron: '5 21 * * 5'      # fri_pm (EST primary / EDT last retry)
    - cron: '35 21 * * 5'     # fri_pm (EST retry)
    - cron: '5 12 * * 6'      # sat_am (EDT primary)
    - cron: '35 12 * * 6'     # sat_am (EDT retry)
    - cron: '5 13 * * 6'      # sat_am (EST primary / EDT last retry)
    - cron: '35 13 * * 6'     # sat_am (EST retry)
  workflow_dispatch:
    inputs:
      slot:
        description: 'tue_pm | thu_pm | fri_pm | sat_am | manual (default: manual full refresh)'
        required: false
        default: ''
      force:
        description: 'rebuild even if this slot already built today (ET)'
        type: boolean
        required: false
        default: false
      season:
        description: 'season (default: current)'
        required: false
        default: ''
      week:
        description: 'week (default: the active week)'
        required: false
        default: ''
      max_credits:
        description: 'cap the 1H sweep at N Odds API credits (rehearse a degraded card)'
        required: false
        default: ''

concurrency:
  group: neon-writers
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ET gate (stdlib only, before any install)
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_SLOT: ${{ inputs.slot }}
          INPUT_FORCE: ${{ inputs.force }}
          GATE_ONLY: 'true'
        # Two of each slot's four backup crons land outside the ET window in
        # any DST regime (the DST design), and until 2026-09-16 every one of
        # them paid setup-python + pip install (~40 s, a whole billed minute)
        # to find that out: 20 of 29 card runs that month were skips. The
        # resolver's gate needs only the standard library, so it runs here on
        # the runner's python3 straight after checkout; everything below is
        # gated on it. The full resolve with the cards-table probe still runs
        # after the install (step `slot`).
        run: |
          python3 -m beatvegas.ci
          echo "gate slot=$(grep '^slot=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2) (schedule='$SCHEDULE')"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.gate.outputs.slot != 'skip'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/lock.txt
      - name: Install
        if: steps.gate.outputs.slot != 'skip'
        # Hash-pinned: requirements/lock.txt names the exact release AND sha256 of
        # every package (see its header), so a compromised upload of any of them
        # cannot reach a runner that holds DATABASE_URL and the API keys. The
        # editable install of this repo then runs without build isolation, so
        # the build backend (setuptools, also in the lock) is never fetched
        # unhashed. Local dev keeps plain `pip install -e .`.
        run: |
          pip install --require-hashes -r requirements/lock.txt
          pip install --no-deps --no-build-isolation -e .
      - name: Restore CFBD reference data (weekly cache)
        id: cfbd_cache
        if: steps.gate.outputs.slot != 'skip'
        uses: ./.github/actions/cfbd-cache
      - name: Resolve slot (beatvegas/ci.py; ET gate + once-per-day cards probe)
        id: slot
        if: steps.gate.outputs.slot != 'skip'
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_SLOT: ${{ inputs.slot }}
          INPUT_FORCE: ${{ inputs.force }}
        # beatvegas.ci reads the `cards` table for a build already on record
        # today (ET) and emits slot=skip. That now applies to a DISPATCH naming
        # a scheduled slot too, so the Vercel cron and this backup cron cannot
        # both build; `force=true` and a bare `manual` dispatch build anyway.
        run: |
          PYTHONPATH=. python -m beatvegas.ci
          echo "resolved slot=$(grep '^slot=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2) (schedule='$SCHEDULE')"
      - name: Resolve season / week
        id: active
        if: steps.slot.outputs.slot != 'skip'
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WEEK: ${{ inputs.week }}
        # The two dispatch inputs are the only values on this job a person
        # types. They reach every later step through `env:` (never inlined as
        # `${{ }}` into a run: block, where GitHub substitutes the text before
        # bash parses it), and they are shape-checked here so a stray quote
        # fails the run instead of becoming a command in a job that holds all
        # three secrets. tests/test_workflows.py guards both properties.
        run: |
          if [ -n "$INPUT_SEASON" ] && ! [[ "$INPUT_SEASON" =~ ^[0-9]{4}$ ]]; then
            echo "::error::season input must be a four-digit year, got '$INPUT_SEASON'"; exit 1
          fi
          if [ -n "$INPUT_WEEK" ] && ! [[ "$INPUT_WEEK" =~ ^[0-9]{1,2}$ ]]; then
            echo "::error::week input must be one or two digits, got '$INPUT_WEEK'"; exit 1
          fi
          read -r SEASON WEEK <<< "$(python -c 'from beatvegas.season import active; s, w = active(); print(s, w if w is not None else "")')"
          SEASON="${INPUT_SEASON:-$SEASON}"
          WEEK="${INPUT_WEEK:-$WEEK}"
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          echo "season=$SEASON week=${WEEK:-none}"
      - name: Check today's inputs (1H sweep + preview)
        id: inputs
        if: steps.slot.outputs.slot != 'skip' && steps.active.outputs.week != ''
        env:
          SEASON: ${{ steps.active.outputs.season }}
          WEEK: ${{ steps.active.outputs.week }}
          FORCE_SWEEP: ${{ steps.slot.outputs.force_sweep }}
          FORCE_PREVIEW: ${{ steps.slot.outputs.force_preview }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from beatvegas.db.models import Game, GamePreview, OddsSnapshot
          from beatvegas.db.store import init_db, session_scope
          init_db()
          season, week = int(os.environ["SEASON"]), int(os.environ["WEEK"])
          today = datetime.utcnow().replace(hour=0, minute=0, second=0, microsecond=0)
          with session_scope() as s:
              snaps = (
                  s.query(OddsSnapshot.id)
                  .join(Game, Game.id == OddsSnapshot.game_id)
                  .filter(Game.season == season, Game.week == week,
                          OddsSnapshot.market == "1H_total", OddsSnapshot.captured_at >= today)
                  .count()
              )
              previews = (
                  s.query(GamePreview.id)
                  .filter(GamePreview.season == season, GamePreview.week == week,
                          GamePreview.updated_at >= today)
                  .count()
              )
          force_sweep = os.environ.get("FORCE_SWEEP") == "true"
          force_preview = os.environ.get("FORCE_PREVIEW") == "true"
          print(f"need_sweep={'true' if (force_sweep or snaps == 0) else 'false'}")
          print(f"need_preview={'true' if (force_preview or previews == 0) else 'false'}")
          PY
          cat "$GITHUB_OUTPUT"
      - name: Full-game refresh (every build; totals+spreads, 4 credits, 4x/wk)
        # Sunday's opener capture is the only other writer of Game.spread /
        # full_game_total; by midweek the market has moved. One bulk call
        # (us,us2 x totals,spreads) over the same 6-day window the morning sweep
        # covers keeps the spread current for the 1H share and the HR-vs-market
        # read. Optional: the card still builds on Sunday's numbers if the Odds
        # API is down.
        if: steps.slot.outputs.force_sweep == 'true' && steps.active.outputs.week != ''
        continue-on-error: true
        run: python scripts/poll_full_game.py --source oddsapi --regions us,us2 --days-ahead 6
      - name: 1H sweep (forced on every scheduled build; else only when today's is missing)
        id: sweep
        if: steps.inputs.outputs.need_sweep == 'true'
        # --status-file records the run's COVERAGE: the sweep can stop at the
        # credit floor or the per-run cap and still exit 0, and only that file
        # tells the build which games carry a stale Hard Rock number.
        #
        # continue-on-error: a mid-sweep Odds API 5xx/429 makes poll_lines exit 1
        # AFTER writing its partial batch and its status file. Without this the
        # job stopped there and NO card was built at all -- the exact outcome the
        # degraded-card design exists to prevent, on its most likely trigger. Now
        # the build runs on the lines the sweep did reach and marks the rest
        # degraded, and the final step below still fails the run so GitHub's
        # failed-run email goes out.
        continue-on-error: true
        env:
          MAX_CREDITS: ${{ inputs.max_credits }}
          # From beatvegas/ci.py's fixed table, not from a person; passed as
          # env all the same so no run: block on this job inlines an expression.
          SWEEP_ARGS: ${{ steps.slot.outputs.sweep_args }}
        # Default cap 150: per-event calls now cost 1 credit, so the CLI's 400
        # default would be 400 events and could no longer bind - including on
        # the --hr-universe FALLBACK, which sweeps every event in the window
        # when the Sunday full-game capture is missing (300+ events). A real
        # slate is ~82 games, so 150 only trips on a runaway, and a sweep that
        # stops early ships the card `degraded`, which is the correct outcome.
        run: |
          extra="--max-credits-per-run 150"
          if [ -n "$MAX_CREDITS" ]; then extra="--max-credits-per-run $MAX_CREDITS"; fi
          python scripts/poll_lines.py $SWEEP_ARGS \
            --status-file "$RUNNER_TEMP/sweep_status.json" $extra
      - name: Re-score after the sweep (residual engine only; no-op under the incumbent)
        # The residual engine conditions on the LIVE 1H line, so its numbers
        # must be refitted after the sweep refreshes those lines. Gated exactly
        # like the sweep: no sweep, nothing new to condition on. `--if-engine`
        # exits 0 without touching the database when config model.engine is
        # not `residual`, so the incumbent's card day is unchanged.
        if: steps.inputs.outputs.need_sweep == 'true'
        env:
          SEASON: ${{ steps.active.outputs.season }}
          WEEK: ${{ steps.active.outputs.week }}
        run: python scripts/weekly_update.py --season "$SEASON" --week "$WEEK" --if-engine residual
      - name: Research preview (forced on every scheduled build; else only when today's is missing)
        id: preview
        if: steps.inputs.outputs.need_preview == 'true'
        # Unofficial sources (ESPN / Rotowire) may be down; the card still builds
        # with the QB-out gate reading whatever preview is on file — but an empty
        # injury feed makes that gate pass EVERY game, so --status-file records it
        # and the build marks those games degraded.
        continue-on-error: true
        env:
          SEASON: ${{ steps.active.outputs.season }}
          WEEK: ${{ steps.active.outputs.week }}
        run: |
          python scripts/research_preview.py \
            --season "$SEASON" \
            --week "$WEEK" \
            --status-file "$RUNNER_TEMP/preview_status.json"
      - name: Build + publish the card (+ paper-log qualifying games in the slot's window)
        id: build
        if: steps.slot.outputs.slot != 'skip'
        env:
          SEASON: ${{ steps.active.outputs.season }}
          WEEK: ${{ steps.active.outputs.week }}
          SLOT: ${{ steps.slot.outputs.slot }}
          PAPER_WINDOW: ${{ steps.slot.outputs.paper_window }}
          NO_PAPER: ${{ steps.slot.outputs.no_paper }}
          PREVIEW_OUTCOME: ${{ steps.preview.outcome }}
          SWEEP_OUTCOME: ${{ steps.sweep.outcome }}
        run: |
          if [ -z "$WEEK" ]; then
            echo "no active week — nothing to build"
            echo "No active week — no card built." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          extra=""
          if [ -n "$PAPER_WINDOW" ]; then extra="--paper-log-window-hours $PAPER_WINDOW"; fi
          # A manual refresh publishes the card but logs NO paper picks: the
          # first log of a game wins forever, so an ad-hoc build would freeze
          # the whole week at that moment's lines.
          if [ "$NO_PAPER" = "true" ]; then extra="$extra --no-paper"; fi
          # A preview step that died before writing its own status (an import
          # error, a timeout) still has to reach the card as a failure: without
          # this the QB-out gate would read a stale file and look clear.
          PREVIEW_STATUS="$RUNNER_TEMP/preview_status.json"
          if [ "$PREVIEW_OUTCOME" = "failure" ] && [ ! -f "$PREVIEW_STATUS" ]; then
            echo '{"ok": false, "reason": "step_failed"}' > "$PREVIEW_STATUS"
          fi
          # Same for the sweep. poll_lines writes its status on every exit path
          # it controls, but a step that died before that (an import error, the
          # runner being killed) would leave no file -- and a MISSING file means
          # "the step did not run", which is not a failure. Omitting
          # unpolled_game_ids holds EVERY game on the card as degraded, which is
          # the correct read when coverage is unknown.
          SWEEP_STATUS="$RUNNER_TEMP/sweep_status.json"
          if [ "$SWEEP_OUTCOME" = "failure" ] && [ ! -f "$SWEEP_STATUS" ]; then
            echo '{"complete": false, "reason": "step_failed", "events_in_window": 0, "events_polled": 0, "credits_spent": null}' > "$SWEEP_STATUS"
          fi
          python scripts/build_card.py --season "$SEASON" --week "$WEEK" $extra \
            --slot "$SLOT" \
            --sweep-status "$SWEEP_STATUS" \
            --preview-status "$PREVIEW_STATUS"
      - name: Save CFBD reference cache (only when this run populated it)
        if: always() && steps.gate.outputs.slot != 'skip' && steps.cfbd_cache.outputs.hit != 'true'
        uses: ./.github/actions/cfbd-cache-save
        with:
          key: ${{ steps.cfbd_cache.outputs.key }}
      - name: Fail the run if the sweep did not complete
        # The card is published either way (see continue-on-error above); this
        # is what still turns the run red, so GitHub's failed-workflow email --
        # the only failure channel this project has -- goes out.
        if: always() && steps.sweep.outcome == 'failure'
        run: |
          echo "::error::1H sweep failed. The card was published DEGRADED off the lines the sweep did reach; check the sweep step for the Odds API error."
          echo "1H sweep FAILED -- card published degraded." >> "$GITHUB_STEP_SUMMARY"
          exit 1
