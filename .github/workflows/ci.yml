name: CI

# Pull-request gate: the web app's unit tests, lint and type-check, and
# the Python engine's ruff + unit tests. No secrets and no database: the Python
# tests that need Postgres are marked `integration` (deselected here) or skip
# themselves when the local pg_sim sandbox is unavailable (tests/conftest.py).

# Least privilege: these jobs read the repo and write to Neon via
# secrets; none of them pushes to git. Without this block the job
# inherits whatever the repository default happens to be, and that
# default is a setting someone can change later without touching
# any workflow.
permissions:
  contents: read

on:
  # pull_request ONLY (2026-09-16). It used to run on `push: main` as well, so
  # every merge re-ran the exact content the PR had just passed -- 81 of 284
  # CI runs in the first half of September, on a private repo where Actions
  # minutes are metered (2,000/month free) and CI was 58% of the bill. Vercel
  # deploys main on its own; the PR run is the gate.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests (vitest)
        run: npx vitest run
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/lock.txt
      - name: Install
        # ruff is a project dependency (requirements.txt), so no separate install.
        # Hash-pinned: requirements/lock.txt names the exact release AND sha256 of
        # every package (see its header), so a compromised upload of any of them
        # cannot reach a runner that holds DATABASE_URL and the API keys. The
        # editable install of this repo then runs without build isolation, so
        # the build backend (setuptools, also in the lock) is never fetched
        # unhashed. Local dev keeps plain `pip install -e .`.
        run: |
          pip install --require-hashes -r requirements/lock.txt
          pip install --no-deps --no-build-isolation -e .
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Unit tests (pytest, no DB)
        run: python -m pytest -q -m "not integration"

  # The Playwright lane (web/playwright.config.ts): the production build served
  # by `next start`, a real Chromium, a real Postgres holding the synthetic
  # fixture week (web/e2e/fixture/). No secrets: the database is a service
  # container with a throwaway password, the app password is the fixture's own
  # constant, and nothing here can reach Neon (seed.mjs refuses a neon.tech URL).
  # The schema is the committed dump (tests/test_e2e_schema_parity.py keeps it
  # current), so the job needs no Python.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beatvegas_e2e
        ports:
          - 54329:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54329/beatvegas_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      # The browser download is ~150 MB; keyed on the exact Playwright version
      # because each release wants its own Chromium build. Split restore/save
      # like the CFBD cache, so a failed run never saves a half-written cache.
      - id: pw_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium (and its OS dependencies)
        run: npx playwright install --with-deps chromium
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.pw_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f e2e/fixture/schema.sql
      - name: Seed the fixture week
        run: node e2e/fixture/seed.mjs
      - name: Build
        run: npm run build
      - name: Playwright
        run: npx playwright test
      - name: Report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
