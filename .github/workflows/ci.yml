name: CI

# Pull-request / main gate: the web app's unit tests, lint and type-check, and
# the Python engine's ruff + unit tests. No secrets and no database: the Python
# tests that need Postgres are marked `integration` (deselected here) or skip
# themselves when the local pg_sim sandbox is unavailable (tests/conftest.py).

# Least privilege: these jobs read the repo and write to Neon via
# secrets; none of them pushes to git. Without this block the job
# inherits whatever the repository default happens to be, and that
# default is a setting someone can change later without touching
# any workflow.
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests (vitest)
        run: npx vitest run
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install
        # ruff is a project dependency (requirements.txt), so no separate install.
        run: pip install -e .
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Unit tests (pytest, no DB)
        run: python -m pytest -q -m "not integration"
