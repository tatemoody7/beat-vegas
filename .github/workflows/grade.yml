name: Weekly grading (results + ledger)

# Refreshes final scores from CFBD and grades the market/model/pick ledgers,
# writing to Neon. Runs in the cloud because the local Mac's usual network
# can't reach Neon (port 5432 filtered). Monday morning: Saturday finals are
# in CFBD by early Sunday, so hours of GHA cron lag still land Monday US time.
# grade.py is delete-then-rewrite idempotent — late Sun/Mon games simply grade
# on the following Monday's run. Off-season every step is a green no-op.
# Post-game refresh + grading: finals, 1H play-by-play aggregates, then the
# ledgers. Pre-game enrichment (pace/weather) + scoring run Sundays
# (sunday.yml). A red run here means "the ledger or PBP factors are stale".
# No ODDS_API_KEY: grading reads snapshots already in Neon.

on:
  schedule:
    # 12:00 UTC Monday = 8am EDT / 7am EST. GitHub cron is best-effort (it
    # dropped 17 of 19 scheduled runs Aug 28-30 2026), so two retries follow;
    # grading is delete-then-rewrite idempotent and spends no API credits.
    - cron: '0 12 * * 1'
    - cron: '0 14 * * 1'
    - cron: '0 17 * * 1'
  workflow_dispatch: {}

concurrency:
  group: grade
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
      PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e .
      - name: Resolve season
        id: season
        run: |
          echo "season=$(python -c 'from beatvegas.season import current_season; print(current_season())')" >> "$GITHUB_OUTPUT"
      - name: Refresh final scores (CFBD)
        run: python scripts/backfill.py --season ${{ steps.season.outputs.season }}
      - name: Refresh 1H play-by-play aggregates (CFBD /plays, finished games)
        # fh_team_game feeds the season-to-date FH factors the Sunday scorer
        # reads; without this the current season never accrues PBP rows. ~20
        # CFBD calls, upsert by (game_id, off_team), fail-silent per season.
        run: python scripts/backfill_pbp.py --season ${{ steps.season.outputs.season }}
      - name: Grade market vs model ledger
        run: python scripts/grade.py --season ${{ steps.season.outputs.season }}
      - name: Grade my picks
        run: python scripts/pick.py grade --season ${{ steps.season.outputs.season }}
      - name: Grade frozen game records
        run: python scripts/grade_records.py
      - name: Grade factor credibility ledger (real lines only)
        run: python scripts/grade_factor_ledger.py
      - name: Alert on failure (red run = the ledger is stale)
        if: failure()
        run: |
          curl -s --max-time 15 -F "token=$PUSHOVER_TOKEN" -F "user=$PUSHOVER_USER" \
            -F "title=Beat Vegas — grading FAILED" \
            -F "message=Run $GITHUB_RUN_ID failed. Results/ledger may be stale. Check Actions." \
            https://api.pushover.net/1/messages.json || true
