name: Daily grading (results + ledger)

# Refreshes final scores from CFBD and grades the market/model/pick ledgers,
# writing to Neon. Runs in the cloud because the local Mac's usual network
# can't reach Neon (port 5432 filtered). Every morning (since 2026-09-08): a
# Thursday game is graded Friday morning, Friday's on Saturday, Saturday's on
# Sunday, and Monday's run is the full weekly pass. grade.py is season-wide and
# delete-then-rewrite idempotent, so a late final simply grades next morning. Off-season every step is a green no-op.
# Both crons run every step with no skip gate, so each run is kept CHEAP: the
# finals refresh only writes games CFBD marks completed (a noon-ET Saturday run
# never freezes a live score), the PBP step fetches only the weeks still missing
# fh_team_game rows, and the post-mortem regrades only the live season except on
# Monday (ET) and on a manual dispatch, when it also redoes the 2023-25 history.
# Post-game refresh + grading: finals, 1H play-by-play aggregates, then the
# ledgers. Pre-game enrichment (pace/weather) + scoring run Sundays
# (sunday.yml). A red run here means "the ledger or PBP factors are stale";
# GitHub emails it and the Monday coaching routine re-kicks the workflow.
# No ODDS_API_KEY: grading reads snapshots already in Neon.

# Least privilege: these jobs read the repo and write to Neon via
# secrets; none of them pushes to git. Without this block the job
# inherits whatever the repository default happens to be, and that
# default is a setting someone can change later without touching
# any workflow.
permissions:
  contents: read

on:
  schedule:
    # 10:30 UTC daily = 6:30am EDT / 5:30am EST, well ahead of card.yml's
    # 12:05Z morning build in the shared neon-writers group (GitHub cancels the
    # older PENDING run when a third arrives). 16:00Z is the retry / late-finals
    # pass. GitHub cron is best-effort; grading spends no Odds API credits.
    - cron: '30 10 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch: {}

concurrency:
  group: neon-writers
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e .
      - name: Resolve season
        id: season
        run: |
          echo "season=$(python -c 'from beatvegas.season import current_season; print(current_season())')" >> "$GITHUB_OUTPUT"
          # ISO weekday in Eastern time (1 = Monday): the weekly full pass.
          echo "et_dow=$(TZ=America/New_York date +%u)" >> "$GITHUB_OUTPUT"
      - name: Refresh schedule, lines and scores (CFBD)
        # Primary source: this is also what creates new games and refreshes
        # lines, so it runs first. continue-on-error because ESPN below covers
        # the part grading actually needs -- on 2026-09-12 CFBD hit its monthly
        # call quota and 429'd for two days, taking every grade with it.
        continue-on-error: true
        run: python scripts/backfill.py --season ${{ steps.season.outputs.season }}
      - name: Backfill any missing final scores (ESPN, no key, no quota)
        # Scores only, onto games the step above already created, keyed by id
        # (ESPN's event ids are the ids we store). Second source for the one
        # input grading cannot do without.
        continue-on-error: true
        run: python scripts/backfill_scores_espn.py --days-back 10
      - name: Refresh 1H play-by-play aggregates (CFBD /plays, finished games)
        # fh_team_game feeds the season-to-date FH factors the Sunday scorer
        # reads; without this the current season never accrues PBP rows.
        # --only-missing: one CFBD call per week that still has a finished FBS
        # game without rows (usually one, often none) instead of all 20 weeks
        # twice a day; upsert by (game_id, off_team), fail-silent per season.
        run: python scripts/backfill_pbp.py --season ${{ steps.season.outputs.season }} --only-missing
      - name: Grade market vs model ledger
        run: python scripts/grade.py --season ${{ steps.season.outputs.season }}
      - name: Grade my picks
        run: python scripts/pick.py grade --season ${{ steps.season.outputs.season }}
      - name: Grade frozen game records
        run: python scripts/grade_records.py
      - name: Grade factor credibility ledger (real lines only)
        run: python scripts/grade_factor_ledger.py
      - name: Post-mortem (rated games vs outcomes -> postmortem_* tables)
        # Regrades the season's cards at Hard Rock's numbers (scope live) every
        # run; the stored 2023-25 ratings under the flat and fair proxies (scope
        # hist, the expensive half) only on Monday ET and on a manual dispatch.
        # Delete-then-rewrite per scope, no API calls. Feeds the Results page
        # panel and docs/POST_MORTEM.md.
        env:
          ET_DOW: ${{ steps.season.outputs.et_dow }}
        run: |
          scope=live
          if [ "$ET_DOW" = "1" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then scope=both; fi
          echo "post-mortem scope=$scope (et_dow=$ET_DOW event=$GITHUB_EVENT_NAME)"
          python scripts/post_mortem.py --write --md "" --scope "$scope"
