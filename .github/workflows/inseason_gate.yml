name: In-season intercept gate (walk-forward report)

# Manual only. Builds the min_games=0 feature frame the live board scores from,
# fits one model per held-out season (trained on prior seasons only) and grades
# every arm on the same games. Each arm blends the prior-season calibration
# intercept with the season's OWN realized bias -- c_t = (1-w)*c_prior +
# w*c_season at w = n/(n+k) -- under an as-of window that closes strictly before
# the game being scored, so no game contributes to its own intercept. The
# incumbent is the w=0 arm, which reproduces bv_line_for_slate exactly.
# Writes reports/inseason_<UTC>.md/.json/.csv, appends the markdown to the run
# summary and uploads the files as an artifact. It is a REPORT, not a CI gate:
# the job exits 0 whatever the numbers say, and adopting an arm would mean
# editing model/bv_line.py in a PR that cites the report -- and, per the
# registry, a prospective paper arm with its own row and its own clock first.
#
# Reads Neon; writes nothing. Spends no Odds API credits, and no CFBD calls for
# any season whose priors are already cached. See docs/HYPOTHESES.md
# (H-INSEASON) for the criterion, frozen before this workflow existed.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      test_seasons:
        description: 'held-out seasons, each graded once (space-separated)'
        default: '2024 2025 2026'
      grid:
        description: 'in-season half-weights k (space-separated)'
        default: '25 50 100 200'

# Read-only, but it shares the DB with the writers and a long frame build should
# not race a card build for the same pooler connections.
concurrency:
  group: neon-writers
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install
        # Hash-pinned: requirements/lock.txt names the exact release AND sha256 of
        # every package (see its header), so a compromised upload of any of them
        # cannot reach a runner that holds DATABASE_URL and the API keys.
        run: |
          pip install --require-hashes -r requirements/lock.txt
          pip install --no-deps --no-build-isolation -e .
      - name: Restore CFBD reference data (weekly cache)
        id: cfbd_cache
        uses: ./.github/actions/cfbd-cache
      - name: Run the gate
        # Inputs go through env, never inlined into bash (script-injection hygiene).
        env:
          IN_TEST_SEASONS: ${{ inputs.test_seasons }}
          IN_GRID: ${{ inputs.grid }}
        run: |
          # Arrays, not a word-split string: no glob expansion, no flag injection.
          read -ra SEASONS <<< "$IN_TEST_SEASONS"
          read -ra GRID <<< "$IN_GRID"
          ARGS=(--test-seasons "${SEASONS[@]}" --grid "${GRID[@]}")
          ARGS+=(--out reports/inseason)
          echo "running: inseason_gate.py ${ARGS[*]}"
          python scripts/inseason_gate.py "${ARGS[@]}"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inseason-gate-report
          path: reports/inseason_*
          if-no-files-found: warn
      - name: Save CFBD reference cache (only when this run populated it)
        if: always() && steps.cfbd_cache.outputs.hit != 'true'
        uses: ./.github/actions/cfbd-cache-save
        with:
          key: ${{ steps.cfbd_cache.outputs.key }}
