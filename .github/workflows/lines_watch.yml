name: Hard Rock 1H line capture

# Captures Hard Rock's (and the rest of the market's) first-half totals into
# Neon — EVERY Hard Rock-priced FBS game, Tuesday through Monday, on the paid
# Odds API tier (100K credits/month since 2026-09-06). Runs in the cloud: GHA
# reaches the Odds API (HTTPS) AND Neon, and runs while the Mac sleeps.
#
# Two modes (the "resolve" step maps each cron to ONE mode; an unmapped cron
# fails the run loudly instead of silently disabling a slot):
#   - 1h_open  — opener sweep: Hard Rock-universe games kicking off in the next
#                6 days that have NO Hard Rock 1H line yet. A game stops being
#                paid for once its opener is captured (--missing-hr-only).
#                Wed 2pm, Thu 10am/4pm, Fri 8am/noon/4pm ET-ish (UTC below).
#   - 1h_close — per-game close: only games kicking off within the next 75 min
#                (--kickoff-within-min 75). Every 30 min across the Saturday
#                kickoff window and the Tue-Fri / Sun-Mon evening windows, so
#                each game is covered by 2-3 slots and a dropped or late slot
#                still yields a pre-kick close. An unchanged number writes no
#                row; it stamps odds_snapshots.last_seen_at (the close time).
#                Slots with no game in the window skip before checkout (the
#                free /events call), spending 0 credits and ~0 minutes.
# The FULL sweeps live in card.yml (one job = sweep then build): four whole-week
# decision builds, Tue/Thu/Fri ~4:05pm ET and Sat ~8:05am ET.
# `market=1h` (full refresh) is workflow_dispatch only.
#
# CREDIT BUDGET (paid tier). A per-event 1H call is 1 CREDIT since 2026-09-09:
# `bookmakers=` with <= 10 books is billed as ONE region and overrides
# `regions` (config odds_api.bookmakers_1h), verified live. Basis: 82 Hard
# Rock-priced FBS games in a 6-day window, measured — the old ~60 in this
# comment understated the real spend by ~40%.
#   - card.yml whole-week sweeps (4 builds x ~82 x 1)  ~= 328/wk (cap 150/run)
#   - card.yml full-game refresh (4 x 4)               ~=  16/wk
#   - closes: ~2.5 polls/game x 82 x 1                 ~= 205/wk (worst 246)
#   - sunday.yml full-game openers (3 runs x 6)        ~=  18/wk
#   Expected ~567/wk (~2,450/mo), worst ~774/wk. Was ~1,308/wk at 2 credits
#   with five morning builds. poll_lines.py prints credits_spent=, hr_rows= and
#   calls_404= on every run and WARNS when spend != events polled (the billing
#   rule regressed) or when a sweep writes no Hard Rock row (the book key
#   drifted); --credit-floor 300 is the month-end reserve.
#
# DST: kickoff windows below are wide enough for EDT and EST (Saturday kickoffs
# fall in 16:00Z-03:30Z EDT / 17:00Z-04:30Z EST), so no cron edit at the change.
#
# CONCURRENCY: every Neon-writing workflow shares the `neon-writers` group
# (tests/test_workflows.py enforces it) so two writers never run at once — a
# concurrent init_db() used to lower an id sequence under an in-flight insert
# (beatvegas/db/store.py::resync_table_sequence). GitHub keeps one running run +
# ONE pending run per group and cancels the older pending run when a third
# arrives; a dropped close slot is re-covered by the next one, so that is fine.
#
# GHA cron routinely fires 5-20+ min late and drops some slots (accepted, not
# fixable); the overlapping close slots absorb the drift.

# Least privilege: these jobs read the repo and write to Neon via
# secrets; none of them pushes to git. Without this block the job
# inherits whatever the repository default happens to be, and that
# default is a setting someone can change later without touching
# any workflow.
permissions:
  contents: read

on:
  schedule:
    # --- 1h_open: retired 2026-09-08 — card.yml's morning build sweeps the
    # whole week Tue-Sat 8am ET; `market=1h_open` stays workflow_dispatch-only.
    # --- 1h_close: per-game closes, every 30 min in the kickoff windows ---
    - cron: '*/30 15-23 * * 6'  # Sat 11am-7:30pm EDT
    - cron: '0,30 0-4 * * 0'    # Sat 8pm-12:30am EDT (Sun UTC)
    - cron: '*/30 22-23 * * 2,3,4,5,0,1'  # Tue-Fri + Sun/Mon evenings 6-7:30pm EDT
    - cron: '0,30 0-3 * * 3,4,5,6,1,2'    # ... 8pm-11:30pm EDT (next day UTC)
  workflow_dispatch:
    inputs:
      market:
        description: 'manual run: 1h (full refresh) | 1h_open | 1h_close'
        default: 1h

concurrency:
  group: neon-writers
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - name: Resolve market from schedule / input
        id: resolve
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MARKET: ${{ inputs.market }}
        run: |
          # The three 1h_open branches were removed on 2026-09-10: their crons
          # were retired when the card build took over the midweek sweep, but
          # the branches stayed behind for months because the workflow test only
          # ever checked crons -> branches, never the reverse. Only 1h_close
          # runs on a schedule now; 1h_open survives as a dispatch input.
          case "$SCHEDULE" in
            '*/30 15-23 * * 6')                 market=1h_close ;;
            '0,30 0-4 * * 0')                   market=1h_close ;;
            '*/30 22-23 * * 2,3,4,5,0,1')       market=1h_close ;;
            '0,30 0-3 * * 3,4,5,6,1,2')         market=1h_close ;;
            '')                                 market="$INPUT_MARKET" ;;   # workflow_dispatch
            *) echo "::error::unmapped cron '$SCHEDULE' - add it to the resolve step"; exit 1 ;;
          esac
          case "$market" in
            1h|1h_open|1h_close) ;;
            *) echo "::error::unknown market '$market'"; exit 1 ;;
          esac
          echo "market=$market" >> "$GITHUB_OUTPUT"
          echo "resolved market=$market (schedule='$SCHEDULE')"
      - name: Close slot pre-check (free /events call; skip when nothing kicks off soon)
        id: precheck
        if: steps.resolve.outputs.market == '1h_close'
        env:
          KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          now=$(date -u +%s)
          until=$(( now + 75*60 ))
          n=$(curl -sf "https://api.the-odds-api.com/v4/sports/americanfootball_ncaaf/events?apiKey=$KEY&dateFormat=unix" \
            | jq --argjson lo "$now" --argjson hi "$until" \
                 '[.[] | select(.commence_time >= $lo and .commence_time <= $hi)] | length' 2>/dev/null || echo unknown)
          echo "events kicking off in the next 75 min: $n"
          if [ "$n" = "0" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.precheck.outputs.skip != 'true'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.precheck.outputs.skip != 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        if: steps.precheck.outputs.skip != 'true'
        # Hash-pinned: requirements.lock names the exact release AND sha256 of
        # every package (see its header), so a compromised upload of any of them
        # cannot reach a runner that holds DATABASE_URL and the API keys. The
        # editable install of this repo then runs without build isolation, so
        # the build backend (setuptools, also in the lock) is never fetched
        # unhashed. Local dev keeps plain `pip install -e .`.
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps --no-build-isolation -e .
      - name: 1H opener sweep (Hard Rock universe, games without an HR 1H line yet)
        if: steps.resolve.outputs.market == '1h_open'
        run: python scripts/poll_lines.py --hr-universe --missing-hr-only --hours-back 0 --days-ahead 6
      - name: 1H per-game close (games kicking off within 75 minutes)
        if: steps.resolve.outputs.market == '1h_close' && steps.precheck.outputs.skip != 'true'
        run: python scripts/poll_lines.py --hr-universe --kickoff-within-min 75 --hours-back 0
      - name: 1H full refresh (manual)
        if: steps.resolve.outputs.market == '1h'
        run: python scripts/poll_lines.py --hr-universe --hours-back 0 --days-ahead 3
