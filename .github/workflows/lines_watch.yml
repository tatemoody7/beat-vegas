name: Hard Rock 1H line capture

# Captures Hard Rock's (and the rest of the market's) first-half totals into
# Neon — EVERY Hard Rock-priced FBS game, Tuesday through Monday, on the paid
# Odds API tier (20K credits/month since 2026-10-05). Runs in the cloud: GHA
# reaches the Odds API (HTTPS) AND Neon, and runs while the Mac sleeps.
#
# Two modes (the "resolve" step maps each cron to ONE mode; an unmapped cron
# fails the run loudly instead of silently disabling a slot):
#   - 1h_open  — opener sweep: Hard Rock-universe games kicking off in the next
#                6 days that have NO Hard Rock 1H line yet. A game stops being
#                paid for once its opener is captured (--missing-hr-only).
#                Wed 2pm, Thu 10am/4pm, Fri 8am/noon/4pm ET-ish (UTC below).
#   - 1h_close — per-game close: only games kicking off within the next 120
#                min (--kickoff-within-min 120; was 75 until 2026-09-28). Every
#                30 min across the Saturday kickoff window and the Tue-Fri /
#                Sun-Mon evening windows, so each game is covered by several
#                slots and a dropped or late slot still yields a pre-kick close.
#                An unchanged number writes no row; it stamps
#                odds_snapshots.last_seen_at (the close time). Slots with no
#                game in the window skip before checkout (the free /events
#                call), spending 0 credits and ~0 minutes.
#                SATURDAY IS ALSO DISPATCHED BY A VERCEL CRON (web/vercel.json
#                -> /api/cron/lines-close, table in web/lib/cronJobs.ts): GitHub
#                fired 3 of the 18 Saturday slots in 2026 week 4 and 5 in week
#                3, leaving ~a third of Hard-Rock-priced games with any snapshot
#                inside the registered 2-hour close window. One Hobby entry per
#                UTC hour 15Z-03Z, each firing once within its hour and always
#                dispatching; the 120-minute look-ahead is what makes ticks up
#                to 119 minutes apart still reach every kickoff inside 2 h.
#                Both triggers stay: a duplicate poll of an unchanged line
#                writes no row and costs 1 credit per game.
# The FULL sweeps live in card.yml (one job = sweep then build): four whole-week
# decision builds, Tue/Thu/Fri ~4:05pm ET and Sat ~8:05am ET.
# `market=1h` (full refresh) is workflow_dispatch only.
#
# CREDIT BUDGET (paid tier). A per-event 1H call is 1 CREDIT since 2026-09-09:
# `bookmakers=` with <= 10 books is billed as ONE region and overrides
# `regions` (config odds_api.bookmakers_1h), verified live. Basis: 82 Hard
# Rock-priced FBS games in a 6-day window, measured — the old ~60 in this
# comment understated the real spend by ~40%.
#   - card.yml whole-week sweeps (4 builds x ~82 x 1)  ~= 328/wk (cap 150/run)
#   - card.yml full-game refresh (4 x 9)               ~=  36/wk
#   - closes: ~2.5 polls/game x 82 x 1                 ~= 205/wk (worst 246)
#     + the Saturday Vercel backup: ~2 more polls/game    ~= +150/wk worst
#   - sunday.yml full-game openers (3 runs x 9)        ~=  27/wk worst
#   Expected ~567/wk (~2,450/mo), worst ~774/wk, before the 2026-10-07 side
#   markets (below). Was ~1,308/wk at 2 credits
#   with five morning builds. poll_lines.py prints credits_spent=, hr_rows= and
#   calls_404= on every run and WARNS when spend != events polled (the billing
#   rule regressed) or when a sweep writes no Hard Rock row (the book key
#   drifted); --credit-floor 300 is the month-end reserve.
#   Plus the full-game close step on every Saturday and weeknight tick:
#   `totals,spreads,h2h` x `us,us2,us_ex` = 9 credits a tick since 2026-10-07
#   (2 on `totals` x `us,us2` from 2026-10-06). With ~25 ticks a week (~17
#   Saturday, ~8 weeknight, the latter an estimate) the roadmap step 4 side
#   markets add ~+200/wk (~+860/mo) in all, to ~3,300/mo of 20K;
#   poll_full_game.py prints `credits: ... spent= remaining=` on every pull.
#
# DST: kickoff windows below are wide enough for EDT and EST (Saturday kickoffs
# fall in 16:00Z-03:30Z EDT / 17:00Z-04:30Z EST), so no cron edit at the change.
#
# CONCURRENCY: every Neon-writing workflow shares the `neon-writers` group
# (tests/test_workflows.py enforces it) so two writers never run at once — a
# concurrent init_db() used to lower an id sequence under an in-flight insert
# (beatvegas/db/store.py::resync_table_sequence). GitHub keeps one running run +
# ONE pending run per group and cancels the older pending run when a third
# arrives; a dropped close slot is re-covered by the next one, so that is fine.
#
# GHA cron routinely fires 5-20+ min late and drops some slots (accepted, not
# fixable); the overlapping close slots absorb the drift.

# Least privilege: these jobs read the repo and write to Neon via
# secrets; none of them pushes to git. Without this block the job
# inherits whatever the repository default happens to be, and that
# default is a setting someone can change later without touching
# any workflow.
permissions:
  contents: read

on:
  schedule:
    # --- 1h_open: retired 2026-09-08 — card.yml's morning build sweeps the
    # whole week Tue-Sat 8am ET; `market=1h_open` stays workflow_dispatch-only.
    # --- 1h_close: per-game closes, every 30 min in the kickoff windows ---
    - cron: '*/30 15-23 * * 6'  # Sat 11am-7:30pm EDT
    - cron: '0,30 0-4 * * 0'    # Sat 8pm-12:30am EDT (Sun UTC)
    - cron: '*/30 22-23 * * 2,3,4,5,0,1'  # Tue-Fri + Sun/Mon evenings 6-7:30pm EDT
    - cron: '0,30 0-3 * * 3,4,5,6,1,2'    # ... 8pm-11:30pm EDT (next day UTC)
  workflow_dispatch:
    inputs:
      market:
        description: 'manual run: 1h (full refresh) | 1h_open | 1h_close | 1h_game (one game, needs game_id)'
        default: 1h
      game_id:
        # The site's "Refresh price" (POST /api/price-refresh, 2026-10-07):
        # one games.id, polled alone for 1 credit when the stored Hard Rock
        # price is more than 6 h old. Validated as digits before use.
        description: 'market=1h_game only: the games.id to poll'
        default: ''

concurrency:
  group: neon-writers
  cancel-in-progress: false

# The close look-ahead, in minutes: the free /events pre-check skips a slot with
# nothing kicking off inside it, and the poll prices the games kicking off inside
# it. ONE number (2026-09-28: it was 75 in the pre-check and 120 in the poll for a
# day, so a slot whose only kickoffs sat 76-119 min out was skipped by the check
# the widening existed for). Vercel Hobby ticks can be 119 min apart; 120 still
# reaches every kickoff inside the registered 2 h close window, 130 would not.
# Since 2026-10-11 (docs/program/CAPTURE_DESIGN_2026-10.md) the Saturday ticks
# look 6 hours ahead instead: the resolve step picks CLOSE_LOOKAHEAD_MIN_SAT for
# a tick inside Saturday's window (14Z Saturday to 05Z Sunday), and the pre-check
# and the poll read the chosen value from the same step output, so the two can
# never disagree again. Weeknights keep 120 (one or two games, the question is
# a Saturday one). The judge's 2-hour close window does not move.
env:
  CLOSE_LOOKAHEAD_MIN: 120
  CLOSE_LOOKAHEAD_MIN_SAT: 360

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - name: Resolve market from schedule / input
        id: resolve
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MARKET: ${{ inputs.market }}
          INPUT_GAME_ID: ${{ inputs.game_id }}
        run: |
          # The three 1h_open branches were removed on 2026-09-10: their crons
          # were retired when the card build took over the midweek sweep, but
          # the branches stayed behind for months because the workflow test only
          # ever checked crons -> branches, never the reverse. Only 1h_close
          # runs on a schedule now; 1h_open survives as a dispatch input.
          case "$SCHEDULE" in
            '*/30 15-23 * * 6')                 market=1h_close ;;
            '0,30 0-4 * * 0')                   market=1h_close ;;
            '*/30 22-23 * * 2,3,4,5,0,1')       market=1h_close ;;
            '0,30 0-3 * * 3,4,5,6,1,2')         market=1h_close ;;
            '')                                 market="$INPUT_MARKET" ;;   # workflow_dispatch
            *) echo "::error::unmapped cron '$SCHEDULE' - add it to the resolve step"; exit 1 ;;
          esac
          case "$market" in
            1h|1h_open|1h_close) ;;
            1h_game)
              # One game, by id: digits only, or the run stops here.
              if ! [[ "$INPUT_GAME_ID" =~ ^[0-9]{1,12}$ ]]; then
                echo "::error::market=1h_game needs a numeric game_id"; exit 1
              fi
              echo "game_id=$INPUT_GAME_ID" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unknown market '$market'"; exit 1 ;;
          esac
          echo "market=$market" >> "$GITHUB_OUTPUT"
          # The close look-ahead for THIS tick: Saturday's window (UTC Saturday
          # from 14Z, or UTC Sunday before 05Z) reads 6 h ahead, else 2 h.
          dow=$(date -u +%u); hour=$(date -u +%H)
          if { [ "$dow" = "6" ] && [ "$hour" -ge 14 ]; } || { [ "$dow" = "7" ] && [ "$hour" -lt 5 ]; }; then
            lookahead="$CLOSE_LOOKAHEAD_MIN_SAT"
          else
            lookahead="$CLOSE_LOOKAHEAD_MIN"
          fi
          echo "lookahead=$lookahead" >> "$GITHUB_OUTPUT"
          echo "resolved market=$market (schedule='$SCHEDULE') lookahead=${lookahead}min"
          # The run's clock for the health contract (last step): every fact it
          # checks must have been written after this instant.
          echo "started=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - name: Close slot pre-check (free /events call; skip when nothing kicks off soon)
        id: precheck
        if: steps.resolve.outputs.market == '1h_close'
        env:
          KEY: ${{ secrets.ODDS_API_KEY }}
          CLOSE_LOOKAHEAD_MIN: ${{ steps.resolve.outputs.lookahead }}
        run: |
          now=$(date -u +%s)
          until=$(( now + CLOSE_LOOKAHEAD_MIN*60 ))
          n=$(curl -sf "https://api.the-odds-api.com/v4/sports/americanfootball_ncaaf/events?apiKey=$KEY&dateFormat=unix" \
            | jq --argjson lo "$now" --argjson hi "$until" \
                 '[.[] | select(.commence_time >= $lo and .commence_time <= $hi)] | length' 2>/dev/null || echo unknown)
          echo "events kicking off in the next $CLOSE_LOOKAHEAD_MIN min: $n"
          if [ "$n" = "0" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.precheck.outputs.skip != 'true'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.precheck.outputs.skip != 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/lock.txt
      - name: Install
        if: steps.precheck.outputs.skip != 'true'
        # Hash-pinned: requirements/lock.txt names the exact release AND sha256 of
        # every package (see its header), so a compromised upload of any of them
        # cannot reach a runner that holds DATABASE_URL and the API keys. The
        # editable install of this repo then runs without build isolation, so
        # the build backend (setuptools, also in the lock) is never fetched
        # unhashed. Local dev keeps plain `pip install -e .`.
        run: |
          pip install --require-hashes -r requirements/lock.txt
          pip install --no-deps --no-build-isolation -e .
      - name: 1H opener sweep (Hard Rock universe, games without an HR 1H line yet)
        if: steps.resolve.outputs.market == '1h_open'
        run: python scripts/poll_lines.py --hr-universe --missing-hr-only --hours-back 0 --days-ahead 6
      - name: 1H per-game close (games kicking off within CLOSE_LOOKAHEAD_MIN)
        id: close
        if: steps.resolve.outputs.market == '1h_close' && steps.precheck.outputs.skip != 'true'
        env:
          CLOSE_LOOKAHEAD_MIN: ${{ steps.resolve.outputs.lookahead }}
        # --status-file records the poll's COVERAGE (events in the window,
        # events polled, credits) for the health contract below.
        run: python scripts/poll_lines.py --hr-universe --kickoff-within-min "$CLOSE_LOOKAHEAD_MIN" --hours-back 0 --status-file "$RUNNER_TEMP/close_status.json"
      - name: Close-window coverage gauge (this Saturday so far; docs/HEALTH.md)
        # After each close poll: the share of today's kicked-off Hard-Rock-priced
        # games with a snapshot inside the 2-hour window, for the board banner
        # (close_coverage_pct). Never fails the run.
        if: steps.close.outcome == 'success'
        continue-on-error: true
        run: python scripts/close_coverage.py
      - name: Full-game close (same ticks; totals, spreads, moneylines for events inside REAL_FG_CLOSE_WINDOW_H)
        id: fgclose
        # The full-game market is a reference ledger (never bet) and the
        # H-FG-U-R / H-FG-O-R retrospectives grade at a REAL full-game close.
        # Before 2026-10-06 only Sunday's opener and the card-day refresh were
        # captured (9 of 380 graded 2026 games had a snapshot inside 3 h). One
        # bulk /odds call per tick for the whole slate. Since 2026-10-07
        # (roadmap step 4) it carries the spread and the moneyline with both
        # prices, and the exchanges (us_ex) for the consensus close:
        # `totals,spreads,h2h` x `us,us2,us_ex` = 9 credits a tick (~25 ticks a
        # week -> ~225). Unchanged numbers are re-seen (last_seen_at) so they
        # count as the close. Never fails the job: continue-on-error, --allow-empty;
        # the health contract judges it instead (--status-file records what the
        # pull covered; lines_watch.fg_close_polled reads it with this step's outcome).
        if: steps.close.outcome == 'success'
        continue-on-error: true
        run: python scripts/poll_full_game.py --source oddsapi --regions us,us2,us_ex --markets totals,spreads,h2h --kickoff-within-min 180 --days-ahead 1 --credit-floor 300 --allow-empty --status-file "$RUNNER_TEMP/fg_close_status.json"
      - name: 1H one-game refresh (the site's Refresh price; 1 credit)
        if: steps.resolve.outputs.market == '1h_game'
        env:
          GAME_ID: ${{ steps.resolve.outputs.game_id }}
        run: python scripts/poll_lines.py --game-id "$GAME_ID" --hours-back 0 --days-ahead 8 --max-credits-per-run 2
      - name: 1H full refresh (manual)
        if: steps.resolve.outputs.market == '1h'
        run: python scripts/poll_lines.py --hr-universe --hours-back 0 --days-ahead 3
      - name: Health contract (docs/HEALTH.md; writes last_health_lines_watch)
        id: health
        # Did this close poll leave behind what it was for? beatvegas/health.py
        # checks the positive facts (the status file says events were polled or
        # none were due; a Hard Rock 1H row was written or re-seen after
        # `started`; the close gauge moved) and writes the verdict + note to
        # `last_health_lines_watch` for the board banner and /api/health. No
        # failed-severity check here (the board's `close` gauge warning covers
        # a dead run of slots), so this never reddens the run. The full-game
        # close step (continue-on-error) is judged here too: its status file
        # and a full-game row written or re-seen after `started`. Only the
        # scheduled market (1h_close) is judged: a dispatched 1h / 1h_open
        # refresh is SKIPPED, no verdict. Runs on always() once python is
        # installed (the pre-check skip installs nothing).
        if: always() && steps.precheck.outputs.skip != 'true' && steps.resolve.outcome == 'success'
        env:
          SKIPPED: ${{ steps.resolve.outputs.market != '1h_close' }}
          RUN_STARTED_AT: ${{ steps.resolve.outputs.started }}
          MARKET: ${{ steps.resolve.outputs.market }}
          OUTCOME_FG: ${{ steps.fgclose.outcome }}
        run: python scripts/health_check.py --job lines_watch --close-status "$RUNNER_TEMP/close_status.json" --fg-status "$RUNNER_TEMP/fg_close_status.json"
