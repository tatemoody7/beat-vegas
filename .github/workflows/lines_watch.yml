name: Hard Rock line watch (push alerts)

# Fires a phone push (Pushover) the moment Hard Rock POSTS a line, so Tate can bet
# the opener before it moves. Runs in the cloud: GHA reaches the Odds API (HTTPS)
# AND Neon, and runs even when the Mac is asleep. Two cadences:
#   - Sunday full-game opener: every 10 min across the ~11am ET drop window.
#   - Mid-week 1H: once daily Mon–Fri (full upcoming-week slate).
#
# CREDIT BUDGET (free tier = 500/mo), scoped to FIT the free tier:
#   - Sunday opener window: */15 across 14:00-17:45 UTC = 16 polls x 2 credits
#     (bulk totals, us+us2) = 32/Sunday ~= 138/mo.
#   - 1H sweep: FRIDAY ONLY (1H lines are up by then; Saturday is the slate),
#     --days-ahead 3 --max-events 40 at 2 credits/event (totals_h1 x us,us2)
#     = <=80/run ~= 344/mo.
#   Total ~= 482/mo. poll_lines.py's --credit-floor (default 60) additionally
#   stops any sweep that would eat the Sunday reserve, and pushes a warning.
#   For more cadence (daily sweeps, */10 Sundays), buy a paid Odds API tier
#   and widen these crons + flags.
#
# GHA cron routinely fires 5-20+ min late (accepted, not fixable): the */15
# Sunday window plus first-appearance detection absorbs the drift — a late poll
# still catches the drop, just minutes later.

on:
  schedule:
    # Sunday full-game opener window — every 15 min, 14:00–17:45 UTC (covers
    # ~10am–1pm EDT and ~9am–12:45pm EST so the 11am-local drop is caught in both
    # DST regimes). First-appearance detection means only the actual drop pushes.
    - cron: '*/15 14-17 * * 0'
    # Weekly 1H sweep — Friday 17:00 UTC (~1pm ET), scoped to the weekend slate.
    - cron: '0 17 * * 5'
  workflow_dispatch:
    inputs:
      market:
        description: 'manual run: full_game | 1h'
        default: full_game

concurrency:
  group: lines-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
      PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e .
      - name: Full-game opener capture + Hard Rock push (Sunday window)
        if: github.event.schedule == '*/15 14-17 * * 0' || github.event.inputs.market == 'full_game'
        run: python scripts/poll_full_game.py --source oddsapi --push
      - name: 1H capture + Hard Rock push (Friday sweep)
        if: github.event.schedule == '0 17 * * 5' || github.event.inputs.market == '1h'
        run: python scripts/poll_lines.py --push --no-alerts --days-ahead 3 --max-events 40
      - name: Alert on failure (red run = capture or push problem)
        if: failure()
        run: |
          curl -s --max-time 15 -F "token=$PUSHOVER_TOKEN" -F "user=$PUSHOVER_USER" \
            -F "title=Beat Vegas — lines_watch FAILED" \
            -F "message=Run $GITHUB_RUN_ID failed (capture or push). Check Actions." \
            https://api.pushover.net/1/messages.json || true
