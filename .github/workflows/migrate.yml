name: Migrate Neon schema (init_db)

# Applies ADDITIVE schema changes to Neon — new columns + new tables that
# beatvegas.db.store.init_db creates/ALTERs (create_all for new tables,
# _MIGRATIONS for new columns). Run after merging schema changes, BEFORE the new
# web code queries them. Idempotent + additive (never drops/wipes). Manual only.

# Least privilege: these jobs read the repo and write to Neon via
# secrets; none of them pushes to git. Without this block the job
# inherits whatever the repository default happens to be, and that
# default is a setting someone can change later without touching
# any workflow.
permissions:
  contents: read

on:
  workflow_dispatch: {}

concurrency:
  group: neon-writers
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e .
      - name: Apply additive schema (new columns + tables)
        run: python -c "from beatvegas.db.store import init_db; init_db(); print('migrated')"
