name: Migrate Neon schema (init_db)

# Applies ADDITIVE schema changes to Neon — new columns + new tables that
# beatvegas.db.store.init_db creates/ALTERs (create_all for new tables,
# _MIGRATIONS for new columns). Run after merging schema changes, BEFORE the new
# web code queries them. Idempotent + additive (never drops/wipes). Manual only.

# Least privilege: these jobs read the repo and write to Neon via
# secrets; none of them pushes to git. Without this block the job
# inherits whatever the repository default happens to be, and that
# default is a setting someone can change later without touching
# any workflow.
permissions:
  contents: read

on:
  workflow_dispatch: {}

concurrency:
  group: neon-writers
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install
        # Hash-pinned: requirements.lock names the exact release AND sha256 of
        # every package (see its header), so a compromised upload of any of them
        # cannot reach a runner that holds DATABASE_URL and the API keys. The
        # editable install of this repo then runs without build isolation, so
        # the build backend (setuptools, also in the lock) is never fetched
        # unhashed. Local dev keeps plain `pip install -e .`.
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Apply additive schema (new columns + tables)
        run: python -c "from beatvegas.db.store import init_db; init_db(); print('migrated')"
