# The market-opening watch (temporary research, Tate's approval 2026-10-15; removed after
# Tuesday 2026-10-20). Every 20 minutes -- every 10 on Monday 06:00-12:59 ET, the window in
# which Hard Rock opened its first-half totals in weeks 5-7 -- one tick of
# scripts/opening_watch.py asks The Odds API which books have posted next week's first-half
# totals, team totals and first-half team totals, and reads full-game totals every other tick.
#
# Read-only by construction: no DATABASE_URL, no setup-python or pip install (the script is
# standard library only), its own concurrency group (never neon-writers), state carried
# tick to tick in the actions cache, every tick's JSONL kept as an artifact. The script
# writes outside_window and stops spending outside Fri 18:00 ET - Tue 18:00 ET, and stops
# every paid call at its 5,500-credit budget. Tate chose 20-minute ticks to keep the
# Actions minutes low (~1 billed minute a tick).
name: Market-opening watch (research, temporary)

on:
  schedule:
    - cron: '*/20 * * * *'
    - cron: '10,30,50 10-16 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'run one tick outside the watch window (a test tick)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: opening-watch
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      FORCE: ${{ inputs.force }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/opening_watch.py
          sparse-checkout-cone-mode: false
      - name: Restore the watch state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: watch-state
          key: opening-state-${{ github.run_id }}
          restore-keys: opening-state-
      - name: One tick
        run: |
          set -euo pipefail
          extra=""
          if [ "$FORCE" = "true" ]; then extra="--force"; fi
          python3 scripts/opening_watch.py --state watch-state/state.json \
            --out "watch-out/tick-$RUN_ID.jsonl" $extra
      - name: Save the watch state
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: watch-state
          key: opening-state-${{ github.run_id }}
      - name: Keep the tick
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opening-watch-${{ github.run_id }}
          path: |
            watch-out/
            watch-state/
          retention-days: 30
          if-no-files-found: warn
