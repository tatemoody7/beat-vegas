name: Post derived lines to the board

# Writes our derived-1H numbers for the posted full-game lines to Neon as
# display-only `predictions` rows (model_version=derived_lines), so they show on
# the Opportunities board labeled "DERIVED — no model pick". Runs in the cloud
# because the Mac can't reach Neon on the campus network. Real in-season scoring
# (gbm_v1, newer created_at) auto-supersedes these per the season-scoped query.

# Least privilege: these jobs read the repo and write to Neon via
# secrets; none of them pushes to git. Without this block the job
# inherits whatever the repository default happens to be, and that
# default is a setting someone can change later without touching
# any workflow.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season (blank = current season)"
        required: false
        default: ""
      week:
        description: "Week filter (blank = all posted)"
        required: false
        default: ""
      source:
        description: "dk | cfbd | auto"
        required: false
        default: "auto"

# Shares sunday.yml's concurrency group: both write derived_lines with a
# delete-then-insert, so they must never overlap.
concurrency:
  group: neon-writers
  cancel-in-progress: false

jobs:
  post-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install
        # Hash-pinned: requirements.lock names the exact release AND sha256 of
        # every package (see its header), so a compromised upload of any of them
        # cannot reach a runner that holds DATABASE_URL and the API keys. The
        # editable install of this repo then runs without build isolation, so
        # the build backend (setuptools, also in the lock) is never fetched
        # unhashed. Local dev keeps plain `pip install -e .`.
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Restore CFBD reference data (weekly cache)
        id: cfbd_cache
        uses: ./.github/actions/cfbd-cache
      - name: Post derived lines
        # Inputs go through env, never inlined into bash (script-injection hygiene).
        env:
          IN_SEASON: ${{ inputs.season }}
          IN_SOURCE: ${{ inputs.source }}
          IN_WEEK: ${{ inputs.week }}
        run: |
          ARGS="--source $IN_SOURCE"
          if [ -n "$IN_SEASON" ]; then ARGS="$ARGS --season $IN_SEASON"; fi
          if [ -n "$IN_WEEK" ]; then ARGS="$ARGS --week $IN_WEEK"; fi
          python scripts/post_derived_lines.py $ARGS
      - name: Save CFBD reference cache (only when this run populated it)
        if: always() && steps.cfbd_cache.outputs.hit != 'true'
        uses: ./.github/actions/cfbd-cache-save
        with:
          key: ${{ steps.cfbd_cache.outputs.key }}
