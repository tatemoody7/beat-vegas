# The Monday read (programme step 10, 2026-10-14): the pricing report
# (H-PRICE-HR, docs/PRICING_RESEARCH.md; Tate's approval 2026-10-12) and the
# six arms' protocol positions, each written ONCE per read date into
# `arm_positions` (unique on hypothesis + read_date, so a retry on the same
# Monday rewrites the same rows with the newer run id -- nothing double-counts).
# The site, the Monday read and the January review read that row. Dispatched by
# the Vercel `pricing-monday` entries (web/lib/cronJobs.ts: 12Z, a 15Z retry, an
# 18Z catch-up; the route re-dispatches only when no run since the window opened
# succeeded); the 12:30Z GitHub cron is the backup. Grading has landed by then
# (grade.yml runs at the 10Z tick). The `monday` health contract (docs/HEALTH.md)
# is how a missing or failed read surfaces on the board and /api/health.
name: Pricing report (Monday)

on:
  schedule:
    - cron: '30 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-writers
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/lock.txt
      - name: Install
        run: |
          pip install --require-hashes -r requirements/lock.txt
          pip install --no-deps --no-build-isolation -e .
      - name: Run clock
        id: clock
        run: |
          echo "started=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - name: Pricing report (writes the H-PRICE-HR arm_positions row)
        id: pricing
        run: python scripts/pricing_check.py --write
      - name: Protocol positions (writes one arm_positions row per arm)
        id: positions
        if: always()
        run: python scripts/protocol_position.py --write
      - name: Publish the report on this run's summary page
        if: always()
        run: |
          f=$(ls -t reports/pricing_check_*.md 2>/dev/null | head -1)
          if [ -n "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; else echo "no report written" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pricing-report
          path: reports/*
          if-no-files-found: warn
      - name: Health contract (docs/HEALTH.md; writes last_health_monday)
        id: health
        # Did this run leave one arm_positions row per registered hypothesis and
        # a pricing report? A `failed` verdict exits 1 (email); `degraded` is
        # board-only. Every value crosses via env:, never inlined.
        if: always()
        env:
          SKIPPED: 'false'
          RUN_STARTED_AT: ${{ steps.clock.outputs.started }}
          OUTCOME_PRICING: ${{ steps.pricing.outcome }}
          OUTCOME_POSITIONS: ${{ steps.positions.outcome }}
        run: python scripts/health_check.py --job monday
