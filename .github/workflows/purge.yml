name: Purge pre-2023 from Neon (one-time, irreversible)

# Manual, irreversible: hard-delete all season<2023 data from Neon. The Mac can't
# reach Neon over the campus network, so this runs in Actions like the other Neon
# jobs. SAFETY: it pg_dumps a full backup to a workflow artifact and only proceeds
# to delete if that backup step succeeds (steps stop on failure). The dump artifact
# is the restore path if you need to undo.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "purge" to confirm the irreversible delete'
        required: true
        default: ''

jobs:
  purge:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Guard on confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "purge" ]; then
            echo "confirm input was not 'purge' — aborting."; exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install postgresql-client-16 (matches Neon)
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
      - name: Full backup (pg_dump -> artifact) — MUST succeed before delete
        run: |
          pg_dump "$DATABASE_URL" --no-owner --no-privileges -f neon-backup-pre-purge.sql
          ls -lh neon-backup-pre-purge.sql
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-backup-pre-purge
          path: neon-backup-pre-purge.sql
          retention-days: 90
      - name: Install package
        run: pip install -e .
      - name: Dry-run (show blast radius)
        run: python scripts/purge_pre2023.py --floor 2023
      - name: Execute purge (irreversible)
        run: python scripts/purge_pre2023.py --floor 2023 --execute
