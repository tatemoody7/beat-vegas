name: Re-score a past week (retro)

# Scores (or re-scores) ONE season/week and regrades the ledgers, writing to
# Neon. Dispatch-only: the weekly Sunday scoring (sunday.yml) and the card-day
# re-score (card.yml) cover the live week; this exists for a week that was never
# scored (2026 week 1) or that needs re-scoring after a data repair.
#
# What it writes: `predictions` rows are delete-then-insert PER GAME
# (beatvegas/model/score.py store_predictions), so a retro score replaces the
# week's rows cleanly. `--no-snapshot` skips the GameRecord freeze: a record
# written after kickoff would not be a pre-game record, and snapshot_slate is
# write-once per (game, model) anyway. Played pushes are dropped from the feature
# frame, so a re-scored played week comes back with slightly fewer rows than the
# week had games. Then grade.py (season-wide, delete-then-rewrite) and
# `pick.py grade` fill the market / model / pick ledgers for the newly scored
# rows. No Odds API credits: it reads the snapshots already in Neon.

# Least privilege: these jobs read the repo and write to Neon via
# secrets; none of them pushes to git. Without this block the job
# inherits whatever the repository default happens to be, and that
# default is a setting someone can change later without touching
# any workflow.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season, e.g. 2026"
        required: true
      week:
        description: "Week to (re-)score, e.g. 1"
        required: true

# Shares the Neon writers' group: predictions and the ledgers are
# delete-then-insert, so this must never overlap sunday.yml / card.yml / grade.yml.
concurrency:
  group: neon-writers
  cancel-in-progress: false

jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install
        # Hash-pinned: requirements/lock.txt names the exact release AND sha256 of
        # every package (see its header), so a compromised upload of any of them
        # cannot reach a runner that holds DATABASE_URL and the API keys. The
        # editable install of this repo then runs without build isolation, so
        # the build backend (setuptools, also in the lock) is never fetched
        # unhashed. Local dev keeps plain `pip install -e .`.
        run: |
          pip install --require-hashes -r requirements/lock.txt
          pip install --no-deps --no-build-isolation -e .
      - name: Restore CFBD reference data (weekly cache)
        id: cfbd_cache
        uses: ./.github/actions/cfbd-cache
      - name: Score the week (no GameRecord snapshots)
        # Inputs go through env, never inlined into bash (script-injection hygiene).
        env:
          IN_SEASON: ${{ inputs.season }}
          IN_WEEK: ${{ inputs.week }}
        run: python scripts/weekly_update.py --season "$IN_SEASON" --week "$IN_WEEK" --no-snapshot
      - name: Grade market vs model ledger
        env:
          IN_SEASON: ${{ inputs.season }}
        run: python scripts/grade.py --season "$IN_SEASON"
      - name: Grade my picks
        env:
          IN_SEASON: ${{ inputs.season }}
        run: python scripts/pick.py grade --season "$IN_SEASON"
      - name: Save CFBD reference cache (only when this run populated it)
        if: always() && steps.cfbd_cache.outputs.hit != 'true'
        uses: ./.github/actions/cfbd-cache-save
        with:
          key: ${{ steps.cfbd_cache.outputs.key }}
