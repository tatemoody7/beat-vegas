name: Weekly research preview (news + injuries)

# Pulls the upcoming week's ESPN news/injuries/QB-out into game_previews (read by
# the web /preview view). Runs in the cloud because it writes Neon (the Mac can't
# reach Neon from the campus network). ESPN is unofficial + fail-silent — display
# only, never a model input. A red run (stale Week Preview) is reported by
# GitHub's failed-workflow email; the Friday card routine re-dispatches it.

# Least privilege: these jobs read the repo and write to Neon via
# secrets; none of them pushes to git. Without this block the job
# inherits whatever the repository default happens to be, and that
# default is a setting someone can change later without touching
# any workflow.
permissions:
  contents: read

on:
  schedule:
    - cron: '0 13 * * 2' # Tue ~9am ET — early-week research read
    - cron: '0 13 * * 5' # Fri ~9am ET — refresh before the weekend
  workflow_dispatch: {}

concurrency:
  group: neon-writers
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # No ODDS_API_KEY on purpose: research_preview.py reads ESPN + the DB only.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e .
      - name: Build week preview (slate + ESPN news/injuries)
        run: python scripts/research_preview.py
