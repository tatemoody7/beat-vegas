name: Weekly research preview (news + injuries)

# Pulls the upcoming week's ESPN news/injuries/QB-out into game_previews (read by
# the web /preview view). Runs in the cloud because it writes Neon (the Mac can't
# reach Neon from the campus network). ESPN is unofficial + fail-silent — display
# only, never a model input.

on:
  schedule:
    - cron: '0 13 * * 2' # Tue ~9am ET — early-week research read
    - cron: '0 13 * * 5' # Fri ~9am ET — refresh before the weekend
  workflow_dispatch: {}

concurrency:
  group: research-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # No ODDS_API_KEY on purpose: research_preview.py reads ESPN + the DB only.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
      PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e .
      - name: Build week preview (slate + ESPN news/injuries)
        run: python scripts/research_preview.py
      - name: Alert on failure (red run = Week Preview / injury data is stale)
        if: failure()
        run: |
          curl -s --max-time 15 -F "token=$PUSHOVER_TOKEN" -F "user=$PUSHOVER_USER" \
            -F "title=Beat Vegas — research_preview FAILED" \
            -F "message=Run $GITHUB_RUN_ID failed. Week Preview news/injuries may be stale. Check Actions." \
            https://api.pushover.net/1/messages.json || true
