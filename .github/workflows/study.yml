name: Study (manual, read-only report)

# Runs one of the registered study scripts (docs/HYPOTHESES.md) against Neon and
# uploads its reports/<name>_<UTC>.{md,json,csv} as an artifact. Exists because the
# campus network filters Neon's port 5432, so a feature-frame study cannot run on
# the Mac. Every script here is a REPORT: exits 0 whatever the numbers say, writes
# no table, spends no Odds API credits. The blend's --freeze writes data/blend.json
# into the RUNNER's checkout only; the committed copy comes from the artifact.
# harness_report is the shared measurement harness (docs/HARNESS.md): it refuses any
# --row that is not a runnable registry row (exit 2) and runs ONCE per row.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'which study'
        type: choice
        options:
          - blend_gate
          - when_to_bet_study
          - gates_study
          - stopping_rule_position
          - neggap_level_study
          - frame_snapshot
          - harness_report
        default: blend_gate
      args:
        description: 'extra arguments (space-separated, no shell syntax)'
        default: ''

# Read-only, but it shares the writers' group so a study never runs beside a
# grading or card job on the same pooler (tests/test_workflows.py requires it of
# every workflow that carries DATABASE_URL).
concurrency:
  group: neon-writers
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install
        # Hash-pinned: requirements/lock.txt names the exact release AND sha256 of
        # every package (see its header), so a compromised upload of any of them
        # cannot reach a runner that holds DATABASE_URL and the API keys. The
        # editable install of this repo then runs without build isolation, so
        # the build backend (setuptools, also in the lock) is never fetched
        # unhashed. Local dev keeps plain `pip install -e .`.
        run: |
          pip install --require-hashes -r requirements/lock.txt
          pip install --no-deps --no-build-isolation -e .
      - name: Restore CFBD reference data (weekly cache)
        id: cfbd_cache
        uses: ./.github/actions/cfbd-cache
      - name: Run the study
        env:
          IN_SCRIPT: ${{ inputs.script }}
          IN_ARGS: ${{ inputs.args }}
        run: |
          case "$IN_SCRIPT" in
            blend_gate|when_to_bet_study|gates_study|stopping_rule_position|neggap_level_study|frame_snapshot|harness_report) ;;
            *) echo "unknown script: $IN_SCRIPT"; exit 1 ;;
          esac
          read -ra ARGS <<< "$IN_ARGS"
          echo "running: scripts/$IN_SCRIPT.py ${ARGS[*]}"
          python "scripts/$IN_SCRIPT.py" "${ARGS[@]}"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: study-${{ inputs.script }}
          path: |
            reports/*
            data/blend.json
          if-no-files-found: warn
      - name: Save CFBD reference cache (only when this run populated it)
        if: always() && steps.cfbd_cache.outputs.hit != 'true'
        uses: ./.github/actions/cfbd-cache-save
        with:
          key: ${{ steps.cfbd_cache.outputs.key }}
