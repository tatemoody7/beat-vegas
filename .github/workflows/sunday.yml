name: Sunday opener capture + score

# Captures the full-game opener and re-scores the board, writing to Neon. Runs in
# the cloud because the local Mac's usual network can't reach Neon (port 5432
# filtered). GHA runners reach Neon fine and run even when the Mac is asleep.
# The "DK fired" iMessage stays local (deploy/com.beatvegas.sunday-notify.plist).

on:
  schedule:
    # GHA cron is UTC with no DST. 18:00 UTC ≈ 2pm EDT / 1pm EST; 19:00 covers
    # the other DST regime. Both fire in season; runs are idempotent (snapshots
    # only written on change, predictions upserted).
    #
    # Deliberately AFTER lines_watch.yml's alert window (14:00-17:45 UTC): this
    # job captures without --push, so if it ran inside the window it could write
    # a Hard Rock snapshot first and consume the first-appearance state, eating
    # the opener push that lines_watch exists to send.
    - cron: '0 18 * * 0'
    - cron: '0 19 * * 0'
  workflow_dispatch: {}

concurrency:
  group: sunday
  cancel-in-progress: false

jobs:
  capture-and-score:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
      PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e .
      - name: Capture full-game openers (multi-book incl. Hard Rock)
        run: python scripts/poll_full_game.py --source oddsapi
      - name: Score + rank the board
        run: python scripts/weekly_update.py
      - name: Alert on failure (red run = no capture/scoring happened)
        if: failure()
        run: |
          curl -s --max-time 15 -F "token=$PUSHOVER_TOKEN" -F "user=$PUSHOVER_USER" \
            -F "title=Beat Vegas — Sunday capture FAILED" \
            -F "message=Run $GITHUB_RUN_ID failed. The board may be stale — do not bet off it. Check Actions." \
            https://api.pushover.net/1/messages.json || true
