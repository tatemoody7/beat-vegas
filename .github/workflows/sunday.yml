name: Sunday opener capture + score

# Captures the full-game opener and re-scores the board, writing to Neon. Runs in
# the cloud because the local Mac's usual network can't reach Neon (port 5432
# filtered). GHA runners reach Neon fine and run even when the Mac is asleep.
# The Sunday 4:45pm ET Claude routine (cfb-sunday-ops) re-dispatches this
# workflow if cron dropped it and texts the recap; no local launchd job remains.
# A red run is reported by GitHub's failed-workflow email (no in-workflow notification).

# Least privilege: these jobs read the repo and write to Neon via
# secrets; none of them pushes to git. Without this block the job
# inherits whatever the repository default happens to be, and that
# default is a setting someone can change later without touching
# any workflow.
permissions:
  contents: read

on:
  schedule:
    # GHA cron is UTC with no DST. 18:00 UTC ≈ 2pm EDT / 1pm EST; 19:00 covers
    # the other DST regime. Both fire in season; runs are idempotent (snapshots
    # only written on change, predictions upserted). These three slots are the
    # only Sunday opener capture (lines_watch.yml covers Fri/Sat 1H only).
    - cron: '0 18 * * 0'
    - cron: '0 19 * * 0'
    # Third slot: GitHub cron is best-effort (17 of 19 scheduled runs were
    # dropped Aug 28-30 2026). Costs 6 credits when it fires (2 markets
    # totals,spreads x 3 regions us,us2,us_ex).
    #
    # These three are now the BACKUP. Since 2026-09-13 a Vercel cron dispatches
    # this workflow (web/vercel.json -> /api/cron/sunday, table in
    # web/lib/cronJobs.ts), the same arrangement the card builds and grading
    # already had. It replaced a Mac routine (cfb-sunday-ops) that was meant to
    # re-kick this and in practice ran once, three days late -- so until now
    # this workflow's only real trigger was the cron above, on a workflow that
    # is the ONLY full-game opener capture and that also refreshes pace,
    # weather, scoring and the derived 1H lines.
    - cron: '30 20 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: 're-capture even if a full-game capture is already on record today (ET)'
        type: boolean
        required: false
        default: false

concurrency:
  group: neon-writers
  cancel-in-progress: false

jobs:
  capture-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Restore CFBD reference data (weekly cache)
        id: cfbd_cache
        uses: ./.github/actions/cfbd-cache
      - name: Resolve active week
        id: active
        run: |
          read -r SEASON WEEK <<< "$(python -c 'from beatvegas.season import active; s, w = active(); print(s, w if w is not None else "")')"
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
      - name: Already captured / scored today? (ET; the credit AND minutes guard)
        id: captured
        if: steps.active.outputs.week != ''
        env:
          FORCE: ${{ inputs.force }}
          SEASON: ${{ steps.active.outputs.season }}
          WEEK: ${{ steps.active.outputs.week }}
        # Three GitHub crons and three Vercel ticks fire every Sunday (the DST
        # design: each regime lands two inside the window). card.yml solved the
        # same problem with a positive fact from the database -- a `cards` row
        # for today -- rather than a run-list probe; this is the same idea, on
        # TWO facts:
        #   need_capture: no full_game_total snapshot written today (ET). Each
        #     capture costs 6 credits (2 markets x 3 regions).
        #   need_score:   no model prediction row for the active week written
        #     today (ET). Until 2026-09-16 only the capture was gated and the
        #     "free" rest of the job re-ran on every tick: on 2026-09-13 four
        #     runs each re-fetched ~290 Open-Meteo forecasts and 22 CFBD
        #     reference calls and rebuilt the frame twice -- 40 runner-minutes
        #     for one useful capture. Keying scoring on its own positive fact
        #     keeps the property the old design had: a run that captured but
        #     died before scoring leaves no prediction row, so the next tick
        #     still scores. `force` overrides both.
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from beatvegas.db.models import Game, OddsSnapshot, Prediction
          from beatvegas.db.store import init_db, session_scope
          init_db()
          et = ZoneInfo("America/New_York")
          midnight_et = datetime.now(et).replace(hour=0, minute=0, second=0, microsecond=0)
          # captured_at / created_at are stored naive UTC.
          since = midnight_et.astimezone(ZoneInfo("UTC")).replace(tzinfo=None)
          season, week = int(os.environ["SEASON"]), int(os.environ["WEEK"])
          with session_scope() as s:
              n = (
                  s.query(OddsSnapshot.id)
                  .filter(
                      OddsSnapshot.market == "full_game_total",
                      OddsSnapshot.captured_at >= since,
                  )
                  .count()
              )
              # Model rows only: post_derived_lines.py's display rows are
              # model_version "derived_lines" and are written AFTER scoring.
              scored = (
                  s.query(Prediction.id)
                  .join(Game, Game.id == Prediction.game_id)
                  .filter(
                      Game.season == season,
                      Game.week == week,
                      Prediction.model_version != "derived_lines",
                      Prediction.created_at >= since,
                  )
                  .count()
              )
          force = os.environ.get("FORCE") == "true"
          print(f"need_capture={'true' if (force or n == 0) else 'false'}")
          print(f"need_score={'true' if (force or scored == 0) else 'false'}")
          print(f"rows_today={n}")
          print(f"scored_today={scored}")
          PY
          cat "$GITHUB_OUTPUT"
      - name: Capture full-game openers (multi-book incl. Hard Rock + no-vig exchanges)
        if: steps.captured.outputs.need_capture == 'true'
        # us_ex adds Kalshi / Novig / ProphetX / BetOpenly (CFTC exchanges, ~0 vig):
        # legal in FL but no 1H totals, so they are a PRICE-COMPARISON source
        # only — they sharpen the market fair price Hard Rock is judged against.
        # +2 credits per run here only (the region multiplies BOTH markets;
        # 3 slots/wk ~= +26/mo worst case); the 1H
        # sweeps stay us,us2 (Hard Rock is in us2; no exchange 1H lines).
        run: python scripts/poll_full_game.py --source oddsapi --regions us,us2,us_ex
      - name: Refresh pace for the active week (TeamRankings, season-to-date as of today)
        id: pace
        # combined_sec_play / combined_plays are model inputs joined on exact
        # (season, week, team) — without this row the upcoming week scores with
        # pace = NaN. Unofficial scrape: a TeamRankings outage must not block
        # scoring, so this step is non-fatal (the board still posts; pace chips
        # read "no data").
        if: steps.captured.outputs.need_score == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/enrich_tempo.py --season ${{ steps.active.outputs.season }} --week ${{ steps.active.outputs.week }} --date "$(date -u +%F)"
      - name: Refresh weather forecasts for the active week (Open-Meteo)
        id: weather
        # wx_* are model inputs joined on game_id; the forecast API covers the
        # coming Saturday from Sunday (16-day horizon). Non-fatal for the same
        # reason as pace. FBS-vs-FBS only (the scored set) since 2026-09-16:
        # the full week was ~290 calls and 8 minutes, 80% of it for games the
        # model never reads.
        if: steps.captured.outputs.need_score == 'true'
        continue-on-error: true
        # Open-Meteo rate-limits the runner: the first live run sat 20+ min in
        # this step. Cap it — scoring must not wait on forecasts.
        timeout-minutes: 8
        run: python scripts/enrich_weather.py --season ${{ steps.active.outputs.season }} --week ${{ steps.active.outputs.week }}
      - name: Score + rank the board
        if: steps.captured.outputs.need_score == 'true'
        # --write-refs: the board-tint anchors come off the frame this step has
        # already built; the derived-lines step below reads them instead of
        # building the whole historical frame a second time (~4.6 MB from Neon).
        run: python scripts/weekly_update.py --write-refs "$RUNNER_TEMP/factor_refs.json"
      - name: Post derived 1H lines for the active week
        # Idempotent replace (post_derived_lines deletes the season's derived
        # rows, then inserts the week's fresh ones). Gated with scoring, so it
        # never runs off-season (the script exits 1 on zero rows).
        if: steps.captured.outputs.need_score == 'true'
        run: python scripts/post_derived_lines.py --season "${{ steps.active.outputs.season }}" --week "${{ steps.active.outputs.week }}" --refs "$RUNNER_TEMP/factor_refs.json"
      - name: Warn when the board scored WITHOUT pace/weather
        # The enrichment steps are continue-on-error so an unofficial-source
        # outage never blocks the board, but a silent miss means the week
        # scored with pace/wx = NaN. Surface it (::warning:: + step summary,
        # not a failure) whenever either step did not succeed.
        if: steps.captured.outputs.need_score == 'true' && (steps.pace.outcome != 'success' || steps.weather.outcome != 'success')
        env:
          PACE_OUTCOME: ${{ steps.pace.outcome }}
          WX_OUTCOME: ${{ steps.weather.outcome }}
        run: |
          MSG="scored WITHOUT pace/weather (pace=$PACE_OUTCOME, weather=$WX_OUTCOME)"
          echo "::warning::$MSG"
          echo "## WARNING: $MSG" >> "$GITHUB_STEP_SUMMARY"
          echo "Board posted; pace/wx chips may read 'no data' for the active week. Re-run the failed enrichment or re-dispatch sunday.yml." >> "$GITHUB_STEP_SUMMARY"
      - name: Save CFBD reference cache (only when this run populated it)
        if: always() && steps.cfbd_cache.outputs.hit != 'true'
        uses: ./.github/actions/cfbd-cache-save
        with:
          key: ${{ steps.cfbd_cache.outputs.key }}
