name: Backfill observed weather (ERA5 + CFBD -> weather_actuals)

# The data behind the Salaga & Howley history look (docs/LITERATURE.md, roadmap
# v1.3, Tate's calls of 2026-10-08): ERA5 hourly around each kickoff (wind and
# rain over the game, temperature and humidity at kickoff) plus CFBD's
# one-reading-per-game as an independent cross-check, for played FBS-vs-FBS games
# 2013-2026. Written to `weather_actuals`, which NOTHING READS but that look
# (tests/test_weather_actuals.py pins it): the champion reads `weather`, the frozen
# studies read `weather_obs`, so this can run at any time without moving either.
#
# Open-Meteo throttles GitHub's shared runner addresses per request: the first
# full run (2026-10-08, one call per game) fetched ~2.6 games a minute and hit
# the 350-minute limit at 925 games. So ERA5 is fetched one call per venue-season
# (~1,700 requests for the whole range). The staging file is cached between runs
# (restore the newest, save under this run's id, even on a timeout): re-dispatch
# and it skips every game already staged. A run that finishes promotes everything
# staged so far, after the --check gate (out-of-range values, gust below wind).
# PYTHONUNBUFFERED: without it a run cut off at its limit loses every progress
# line still sitting in Python's output buffer (the first run's log was empty).

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      start:
        description: 'first season'
        default: '2013'
      end:
        description: 'last season'
        default: '2026'
      sources:
        description: 'comma-separated: era5, cfbd'
        default: 'era5,cfbd'
      promote:
        description: 'write the staged rows into weather_actuals'
        type: boolean
        default: true

concurrency:
  group: neon-writers
  cancel-in-progress: false

jobs:
  weather-actuals:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: '1'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      SEASON_START: ${{ inputs.start }}
      SEASON_END: ${{ inputs.end }}
      SOURCES: ${{ inputs.sources }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/lock.txt
      - name: Install
        # Hash-pinned: requirements/lock.txt names the exact release AND sha256 of
        # every package, so a compromised upload cannot reach a runner that holds
        # DATABASE_URL and the API keys.
        run: |
          pip install --require-hashes -r requirements/lock.txt
          pip install --no-deps --no-build-isolation -e .

      - name: Restore the staging file (the resume point)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/cache/weather_actuals_staging.*
          key: weather-actuals-staging-${{ github.run_id }}
          restore-keys: weather-actuals-staging-

      - name: Fetch (staging only -- no database writes)
        run: python scripts/backfill_weather_actuals.py --start "$SEASON_START" --end "$SEASON_END" --sources "$SOURCES"

      - name: Check before promoting
        run: python scripts/backfill_weather_actuals.py --check

      - name: Promote into weather_actuals
        if: ${{ inputs.promote }}
        run: python scripts/backfill_weather_actuals.py --promote --sources "$SOURCES"

      - name: Coverage after
        run: |
          python - <<'PY'
          from sqlalchemy import text
          from beatvegas.db.store import session_scope
          with session_scope() as s:
              for r in s.execute(text(
                  "select w.source, g.season, count(distinct w.game_id), count(*) "
                  "from weather_actuals w join games g on g.id = w.game_id "
                  "group by 1, 2 order by 1, 2")):
                  print("weather_actuals", r)
          PY

      - name: Save the staging file for the next run
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/cache/weather_actuals_staging.*
          key: weather-actuals-staging-${{ github.run_id }}

      - name: Keep the staging file as an artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weather-actuals-staging
          path: data/cache/weather_actuals_staging.*
          retention-days: 7
