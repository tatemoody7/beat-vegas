# Copy to config.yaml and fill in. config.yaml is gitignored (keeps your key private).
# You can also set CFBD_API_KEY in the environment instead of putting it here.

cfbd:
  # Free key: https://collegefootballdata.com/key
  api_key: ""            # or leave blank and export CFBD_API_KEY=...
  base_url: "https://api.collegefootballdata.com"

database:
  path: "data/beatvegas.db"

backfill:
  start_season: 2015
  # Bump each August — or delete this line: scripts fall back to the current
  # season when end_season is unset.
  end_season: 2026
  # 'regular' or 'both' (regular + postseason)
  season_type: "both" # regular + postseason (bowls/playoff); "regular" to exclude bowls

model:
  # Which 1H engine score_slate runs (scripts/weekly_update.py). PRODUCTION
  # CONFIG: GHA has no config.yaml, so this value IS the prod engine (see the
  # odds_api.regions note). Override per run with BV_ENGINE=<name>.
  #   bv_line  — incumbent market-blind regressor; bv_line = our own 1H number
  #   residual — market-residual engine (model/residual.py): conditions on the
  #              pre-kick 1H line and predicts actual − line; bv_line = line + r̂.
  #              Needs >= RESIDUAL_MIN_TRAIN training games with a REAL 1H close
  #              or score_slate falls back to bv_line (attrs["engine_fallback"]).
  engine: "bv_line"   # bv_line | residual

proxy_line:
  # Fallback ratio used before empirical calibration runs.
  # 1H total ~= ratio * full-game total. Calibrated by etl/proxy_line.py.
  default_ratio: 0.52

odds_api:
  # Paid 100K-credit plan since 2026-09-06 (was the free 500/mo key): https://the-odds-api.com/  (or export ODDS_API_KEY)
  api_key: ""
  base_url: "https://api.the-odds-api.com/v4"
  sport: "americanfootball_ncaaf"
  regions: "us,us2"           # us2 carries Hard Rock FL; needed to capture HR.
                              # PRODUCTION RELIES ON THIS VALUE: the GitHub Actions
                              # jobs have no config.yaml, so this example file IS the
                              # prod regions config (keys come from GH secrets).
                              # Since bookmakers_1h below is set, regions governs
                              # only the BULK full-game pull (list_full_game_odds,
                              # billed markets x regions for the whole slate, 4
                              # credits) — the per-event 1H call ignores it.
                              # us_ex (Kalshi/Novig/ProphetX/BetOpenly, ~0-vig
                              # exchanges) is added ONLY on the Sunday full-game
                              # capture via --regions (sunday.yml).
  markets: "totals_h1"        # first-half totals
  odds_format: "american"
  # The per-event 1H endpoint is billed markets x regions. `bookmakers=` counts
  # as ONE region and takes priority over `regions`, so totals_h1 x 1 = 1 credit
  # per event instead of 2 on us,us2 — verified live 2026-09-09
  # (x-requests-last: 1, response carried hardrockbet plus 7 comparison books).
  # EXACTLY 10 KEYS: an 11th bills a second region and silently doubles every
  # sweep, so odds.py refuses to start with more. The non-Hard-Rock books are
  # NOT optional — card.py market_read and web/lib/lineCheck.ts build the fair
  # price from the median over them.
  # This is the list of books actually seen posting NCAAF totals_h1.
  bookmakers_1h:
    - hardrockbet       # the only bettable book (us2). Losing this key blinds
                        # every card: poll_lines.py warns when a sweep writes
                        # no hardrockbet row.
    - draftkings
    - fanduel
    - betmgm
    - williamhill_us
    - betrivers
    - ballybet
    - espnbet
    - bovada
    - fliff             # excluded from the fair price (card.py
                        # FAIR_PRICE_EXCLUDED); kept for the Line Check page.
  # Optional whitelist of bookmaker keys applied to the RESPONSE after it is
  # paid for (empty = keep all). Not the same thing as bookmakers_1h, which is
  # the request-side list that sets the price.
  books: []
