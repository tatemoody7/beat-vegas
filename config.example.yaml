# Copy to config.yaml and fill in. config.yaml is gitignored (keeps your key private).
# You can also set CFBD_API_KEY in the environment instead of putting it here.

cfbd:
  # Free key: https://collegefootballdata.com/key
  api_key: ""            # or leave blank and export CFBD_API_KEY=...
  base_url: "https://api.collegefootballdata.com"

database:
  path: "data/beatvegas.db"

backfill:
  start_season: 2015
  # Bump each August — or delete this line: scripts fall back to the current
  # season when end_season is unset.
  end_season: 2026
  # 'regular' or 'both' (regular + postseason)
  season_type: "both" # regular + postseason (bowls/playoff); "regular" to exclude bowls

proxy_line:
  # Fallback ratio used before empirical calibration runs.
  # 1H total ~= ratio * full-game total. Calibrated by etl/proxy_line.py.
  default_ratio: 0.52

odds_api:
  # Free key (500 req/month): https://the-odds-api.com/  (or export ODDS_API_KEY)
  api_key: ""
  base_url: "https://api.the-odds-api.com/v4"
  sport: "americanfootball_ncaaf"
  regions: "us,us2"           # us2 carries Hard Rock FL; needed to capture HR.
                              # NB: 1H (totals_h1) is per-event & costs markets x
                              # regions PER GAME, so us,us2 doubles 1H credit use.
                              # us_ex (Kalshi/Novig/ProphetX/BetOpenly, ~0-vig
                              # exchanges) is added ONLY on the Sunday full-game
                              # capture via --regions (sunday.yml) — not here, so
                              # the per-event 1H sweeps don't pay a third region.
  markets: "totals_h1"        # first-half totals
  odds_format: "american"
  # Optional whitelist of bookmaker keys (empty = all available).
  books: []

alerts:
  imessage_to: ""        # phone/email handle for iMessage alerts (Phase 3)
  line_move_threshold: 1.0

push:                    # cloud push for "Hard Rock lines dropped" (works from CI)
  provider: pushover     # pushover (recommended) | ntfy
  pushover:
    token: ""            # Pushover app token (or env PUSHOVER_TOKEN)
    user: ""             # Pushover user key (or env PUSHOVER_USER)
  ntfy:
    topic: ""            # ntfy topic, e.g. beatvegas-<random> (or env NTFY_TOPIC)
    server: "https://ntfy.sh"
