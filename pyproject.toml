[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beatvegas"
version = "0.1.0"
description = "College football first-half unders research & analysis system (research only, no betting automation)"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["beatvegas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
