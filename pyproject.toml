[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beatvegas"
version = "0.1.0"
description = "College football first-half unders research & analysis system (research only, no betting automation)"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["beatvegas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["web", ".venv", "data"]

[tool.ruff.lint]
# Pragmatic default set: pyflakes (F) + pycodestyle errors (E) + import sorting (I)
# + a few bugbears (B). Deliberately NOT enabling pyupgrade (UP): rewriting
# Optional[x] -> x | None breaks at runtime on this project's Python 3.9 target.
select = ["F", "E", "I", "B"]
ignore = [
    "E501",  # line length handled by the formatter, not enforced as an error
    "B008",  # function calls in argument defaults (common + intentional here)
]
